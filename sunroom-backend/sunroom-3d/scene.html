          // the roof dies INTO the house instead of hanging a corner + gutter
          // stub over the bricks (the awkward corners circled 2026-07-13).
          g.add(
            quad(rA, rB, [-OH, wallH, z1], [0, wallH, z0], darken(shHex, 25)),
          );
          g.add(
            quad(
              rA,
              rB,
              [wallW_C + OH, wallH, z1],
              [wallW_C, wallH, z0],
              shHex,
            ),
          );
          // White fascia boards under the eaves, SLANTED to follow the tapered
          // eave edge (front overhang → flush at the house, z 0..z1).
          const fascia = (xNear, xFar) => {
            const dx = xFar - xNear,
              len = Math.sqrt(dx * dx + z1 * z1),
              bar = box(
                0.4,
                0.4,
                len,
                fmat,
                (xNear + xFar) / 2,
                wallH - 0.2,
                z1 / 2,
              );
            bar.rotation.y = Math.atan2(dx, z1);
            return bar;
          };
          g.add(fascia(0, -OH));
          g.add(fascia(wallW_C, wallW_C + OH));
        } else if (roofStyle === "gable") {
          const gH = ROOF_RISE > 0 ? ROOF_RISE : wallH * 0.42,
            ridgeZ = wallW_B / 2;
          const pLen = Math.sqrt(ridgeZ ** 2 + gH ** 2),
            pAng = Math.atan2(gH, ridgeZ);
          // Extend the EAVE only (length pLen + OH, center shifted toward the
          // eave by OH/2 along the slope) so the slopes don't poke past the ridge
          // and overlap — that overlap was the rough/doubled peak in the composite.
          const dy = (OH / 2) * (gH / pLen),
            dz = (OH / 2) * (ridgeZ / pLen);
          // Course density scaled to real dims (plane UVs are 0..1: u = width,
          // v = slope direction, courses run parallel to the ridge).
          const bcU = shingleTiles(wallW_C + OH * 2),
            bcV = shingleTiles(pLen + OH);
          // house-side slope: rises from z=0 to ridge at z=ridgeZ
          const lm = new THREE.Mesh(
            new THREE.PlaneGeometry(wallW_C + OH * 2, pLen + OH),
            shingleMat(shHex, bcU, bcV),
          );
          lm.rotation.x = Math.PI / 2 - pAng;
          lm.position.set(wallW_C / 2, wallH + gH / 2 - dy, ridgeZ / 2 - dz);
          lm.castShadow = lm.receiveShadow = true;
          g.add(lm);
          // front slope: falls from ridge at z=ridgeZ to z=wallW_B
          const rm = new THREE.Mesh(
            new THREE.PlaneGeometry(wallW_C + OH * 2, pLen + OH),
            shingleMat(darken(shHex, 25), bcU, bcV),
          );
          rm.rotation.x = -(Math.PI / 2 - pAng);
          rm.position.set(
            wallW_C / 2,
            wallH + gH / 2 - dy,
            ridgeZ + ridgeZ / 2 + dz,
          );
          rm.castShadow = rm.receiveShadow = true;
          g.add(rm);
          // No white ridge bar on top — real shingles have none, and it made the
          // AI paint a white stripe across the roof. Instead, white FASCIA boards
          // hang just BELOW the brown roof eaves (front + house side), giving the
          // overhang depth so the AI doesn't read the roof as flat.
          g.add(
            box(
              wallW_C + OH * 2,
              0.4,
              0.12,
              fmat,
              wallW_C / 2,
              wallH - 0.2,
              -OH,
            ),
          );
          g.add(
            box(
              wallW_C + OH * 2,
              0.4,
              0.12,
              fmat,
              wallW_C / 2,
              wallH - 0.2,
              wallW_B + OH,
            ),
          );
        } else {
          // Studio shed roof: HIGH at the house sloping DOWN to the front eave.
          // The rotation sign was inverted for a long time — the roof floated
          // above the FRONT wall and dove down INTO the house (user report
          // 2026-07-19). The gable branch's π/2−pAng rises with z; the shed must
          // fall with z.
          //
          // WHICH axis runs house→front flips with the wall combo. gableOnFront
          // means the front slot holds wall B, i.e. the AB frame: house at z=0,
          // depth along Z. The BC frame is TRANSPOSED — there the side wall is
          // the front slot, spanning world X with the house at x=wallW_C — so
          // build the shed canonically (width along X, depth along +Z, high at
          // z=0) and rotate it into place. Without this the shed sloped ALONG
          // the front wall on every BC capture (user report 2026-07-27).
          const alongX = !gableOnFront;
          const depth = alongX ? wallW_C : wallW_B;
          const width = alongX ? wallW_B : wallW_C;
          const slope = ROOF_RISE > 0 ? ROOF_RISE : depth * 0.08,
            pAng = Math.atan2(slope, depth);
          const pLen = Math.sqrt(depth ** 2 + slope ** 2) + OH;
          const sg = new THREE.Group();
          const rm = new THREE.Mesh(
            new THREE.PlaneGeometry(width + OH * 2, pLen),
            shingleMat(shHex, shingleTiles(width + OH * 2), shingleTiles(pLen)),
          );
          rm.rotation.x = -(Math.PI / 2 - pAng);
          // Center shifted OH/2 down-slope so the top edge is FLUSH at the house
          // wall (nothing pokes over the bricks — same lesson as the removed
          // gable rear tuck) and the whole OH overhang lands at the front eave.
          rm.position.set(
            width / 2,
            wallH + slope / 2 - (OH / 2) * Math.sin(pAng),
            depth / 2 + (OH / 2) * Math.cos(pAng),
          );
          rm.castShadow = rm.receiveShadow = true;
          sg.add(rm);
          if (alongX) {
            // rotation.y=-π/2 maps local (x,y,z) → world (-z, y, x); the +x shift
            // then puts the high end (local z=0) at the house, x=wallW_C, and the
            // low eave at x=0.
            sg.rotation.y = -Math.PI / 2;
            sg.position.x = wallW_C;
          }
          g.add(sg);
          // NO front fascia board. That thin board along the front eave WAS the
          // "tan line outlining the roof": whatever colour it was given (white, or
          // a dark tone), the warm scene lights washed it to a light tan strip
          // spanning the whole eave, a different colour from the frames — proven
          // by tinting it and watching exactly that strip light up (user report,
          // three rounds, 2026-07-21). The unlit dark roof plane and its overhang
          // already give the eave its edge and depth, so the board is pure
          // liability. Gone.
        }
        return g;
      }

      function buildShadow(wallW_B, wallW_C) {
        // photoreal + kontext (HYBRID): a SOFT radial-gradient ambient-occlusion
        // contact shadow that spills past the footprint onto the visible ground,
        // so the structure reads as sitting ON the yard instead of pasted over
        // it. The old hard rectangle (kept for legacy canny below) sat mostly
        // UNDER the walls and had no falloff, so no grounding showed.
        // Direction-agnostic (a symmetric AO puddle, no sun-direction
        // assumption) — a real sun-matched cast shadow is a later, harder step.
        // Stays noMask (outside the structure mask, so the tone-match and the
        // config gate never touch ground pixels) — instead it gets its OWN
        // Pass-4 shadow mask (userData.isShadow + the white maskMat below), and
        // tasks.py re-locks the background through structure ∪ shadow, so the
        // shadow survives to the final image (it was being erased by the photo
        // re-lock, leaving the base floating — user report 2026-08-15).
        if (GLASS_STYLE === "photoreal" || GLASS_STYLE === "kontext") {
          const mkGrad = (color) => {
            const c = document.createElement("canvas");
            c.width = c.height = 128;
            const x = c.getContext("2d");
            const g = x.createRadialGradient(64, 64, 12, 64, 64, 64);
            g.addColorStop(0.0, `rgba(${color},0.5)`);
            g.addColorStop(0.5, `rgba(${color},0.32)`);
            g.addColorStop(1.0, `rgba(${color},0)`);
            x.fillStyle = g;
            x.fillRect(0, 0, 128, 128);
            // CONTACT ring at the footprint perimeter — the darkest shadow is
            // exactly where walls meet ground, which is what visually welds the
            // base to the patio ("still floating", user 2026-08-15). Plane is
            // footprint×(1.7,1.9), so the footprint edge in canvas coords is
            // x 26..102, y 30..98. Stroked wide→narrow for a soft blur.
            x.lineJoin = "round";
            for (const [lw, a] of [
              [14, 0.1],
              [8, 0.16],
              [4, 0.22],
            ]) {
              x.strokeStyle = `rgba(${color},${a})`;
              x.lineWidth = lw;
              x.strokeRect(26, 30, 76, 68);
            }
            return new THREE.CanvasTexture(c);
          };
          const m = new THREE.Mesh(
            new THREE.PlaneGeometry(wallW_C * 1.7, wallW_B * 1.9),
            new THREE.MeshBasicMaterial({
              map: mkGrad("0,0,0"),
              transparent: true,
              depthWrite: false,
            }),
          );
          m.rotation.x = -Math.PI / 2;
          m.position.set(wallW_C / 2, 0.02, wallW_B / 2);
          m.renderOrder = 1;
          m.userData.noMask = true;
          m.userData.isShadow = true;
          // White twin of the gradient for the Pass-4 shadow-alpha mask.
          m.userData.maskMat = new THREE.MeshBasicMaterial({
            map: mkGrad("255,255,255"),
            transparent: true,
            depthWrite: false,
          });
          return m;
        }
        // Stronger contact shadow on the patio — anchors the sunroom as a 3D
        // object standing IN FRONT of the house, not a window set into the wall.
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(wallW_C * 1.2, wallW_B * 0.8),
          new THREE.MeshBasicMaterial({
            color: 0x000000,
            transparent: true,
            opacity: 0.34,
          }),
        );
        m.rotation.x = -Math.PI / 2;
        m.position.set(wallW_C / 2, 0.01, wallW_B * 0.78);
        m.userData.noMask = true; // ground shadow is not part of the structure mask
        return m;
      }

      async function sampleShingle(photoDataUrl, photoW, photoH) {
        const tmp = document.createElement("canvas");
        tmp.width = photoW;
        tmp.height = photoH;
        const tc = tmp.getContext("2d");
        await new Promise((res, rej) => {
          const img = new Image();
          img.onload = () => {
            tc.drawImage(img, 0, 0, photoW, photoH);
            res();
          };
          img.onerror = rej;
          img.src = photoDataUrl;
        });
        const startY = Math.floor(photoH * 0.08),
          stripH = Math.floor(photoH * 0.12);
        const id = tc.getImageData(0, startY, photoW, stripH).data;
        let r = 0,
          g = 0,
          b = 0,
          cnt = 0;
        for (let i = 0; i < id.length; i += 4) {
          r += id[i];
          g += id[i + 1];
          b += id[i + 2];
          cnt++;
        }
        return rgbHex(
          Math.round((r / cnt) * 0.75),
          Math.round((g / cnt) * 0.75),
          Math.round((b / cnt) * 0.75),
        );
      }

      function worldToScreen(cam, x, y, z, W, H) {
        const v = new THREE.Vector3(x, y, z).project(cam);
        return [((v.x + 1) / 2) * W, ((1 - v.y) / 2) * H];
      }

      // Procedural sky/ground equirect texture so glass reflects something — this
      // is what makes glass read as GLASS (sky on top, ground tone at the horizon)
      // instead of a see-through film. Used directly as material.envMap, which
      // works in software WebGL (no PMREMGenerator, which fails on swiftshader).
      function makeSkyTexture() {
        const c = document.createElement("canvas");
        c.width = 64;
        c.height = 512;
        const ctx = c.getContext("2d");
        const g = ctx.createLinearGradient(0, 0, 0, 512);
        g.addColorStop(0.0, "#7fb4e6"); // zenith blue
        g.addColorStop(0.42, "#cfe4f5"); // pale sky near horizon
        g.addColorStop(0.5, "#fbfcfb"); // bright horizon haze
        g.addColorStop(0.52, "#b9b0a0"); // ground
        g.addColorStop(1.0, "#6f6757"); // darker ground
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 64, 512);
        const tex = new THREE.CanvasTexture(c);
        tex.mapping = THREE.EquirectangularReflectionMapping;
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // ── Under-existing post-pass ────────────────────────────────────────────
      // There is no NEW roof for under-existing rooms — the walls rise to the
      // EXISTING house roof. The renderer builds the walls tall (overshooting),
      // then this clips everything ABOVE the traced roofline back to the original
      // photo (so the existing roof shows through) and lays a header beam along
      // the line. Returns updated { composite, mask } data URLs.
      // roofline = normalized [[x,y], ...] left->right; ends = back-top corners.
      async function applyUnderExisting(
        compositeURL,
        maskURL,
        photoDataUrl,
        roofline,
        photoW,
        photoH,
        frameHex,
      ) {
        const pts = roofline.map(([x, y]) => [x * photoW, y * photoH]);

        // Region from the top of the image DOWN to the polyline (flat-extrapolated
        // beyond the endpoints) — everything here is above the roofline.
        const abovePath = (ctx) => {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(photoW, 0);
          ctx.lineTo(photoW, pts[pts.length - 1][1]);
          for (let i = pts.length - 1; i >= 0; i--)
            ctx.lineTo(pts[i][0], pts[i][1]);
          ctx.lineTo(0, pts[0][1]);
          ctx.closePath();
        };
        const strokeHeader = (ctx, color) => {
          ctx.beginPath();
          ctx.moveTo(pts[0][0], pts[0][1]);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
          ctx.lineWidth = Math.max(6, Math.round(photoH * 0.014));
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.strokeStyle = color;
          ctx.stroke();
        };
        const loadImg = (src) =>
          new Promise((res, rej) => {
            const im = new Image();
            im.onload = () => res(im);
            im.onerror = rej;
            im.src = src;
          });

        const [compImg, photoImg, maskImg] = await Promise.all([
          loadImg(compositeURL),
          loadImg(photoDataUrl),
          loadImg(maskURL),
        ]);

        // Composite: cover anything above the roofline with the original photo
        // (the existing roof), then draw the header beam in the frame colour.
        const cc = document.createElement("canvas");
        cc.width = photoW;
        cc.height = photoH;
        const cx = cc.getContext("2d");
        cx.drawImage(compImg, 0, 0, photoW, photoH);
        cx.save();
        abovePath(cx);
        cx.clip();
        cx.drawImage(photoImg, 0, 0, photoW, photoH);
        cx.restore();
        // NO header-beam stroke on the composite. It was drawn in the frame
        // colour along the traced roofline — with a tan frame that rendered as a
        // bright tan line tracing the exact roofline the user outlined, which
        // they wanted gone (2026-07-21). The walls already rise to the roofline,
        // so they meet the existing roof cleanly without a painted-on beam. The
        // MASK still marks this strip as structure (below), so the AI repaints
        // the wall-to-roof junction — just without a crude coloured line baked in.
        const composite = cc.toDataURL("image/jpeg", 0.95);

        // Mask: black out above the roofline; header beam is white (it IS
        // structure the AI should repaint).
        const mc = document.createElement("canvas");
        mc.width = photoW;
        mc.height = photoH;
        const mx = mc.getContext("2d");
        mx.drawImage(maskImg, 0, 0, photoW, photoH);
        mx.save();
        abovePath(mx);
        mx.clip();
        mx.fillStyle = "#000";
        mx.fillRect(0, 0, photoW, photoH);
        mx.restore();
        strokeHeader(mx, "#ffffff");
        const mask = mc.toDataURL("image/png");

        return { composite, mask };
      }

      // ── Photo tone-match (Phase 1, 2026-08-15) ─────────────────────────────
      // The structure is lit by a FIXED light rig; the photo was lit by the real
      // sun — the mismatch is a big part of the "pasted CGI" read. Measure the
      // photo's per-channel means (sky rows excluded) vs the structure's, then
      // nudge the structure HALFWAY toward the photo's tone through the exact
      // structure mask (photo pixels untouched; mask value = blend weight, so
      // feathered edges blend). Half-strength + clamped gains so a golden-hour
      // photo warms the frames believably without dyeing them orange.
      async function toneMatchStructure(compositeURL, maskURL, photoDataUrl, W, H) {
        const load = (src) =>
          new Promise((res, rej) => {
            const im = new Image();
            im.onload = () => res(im);
            im.onerror = rej;
            im.src = src;
          });
        const [comp, mask, photo] = await Promise.all([
          load(compositeURL),
          load(maskURL),
          load(photoDataUrl),
        ]);
        const cnv = (img) => {
          const c = document.createElement("canvas");
          c.width = W;
          c.height = H;
          const x = c.getContext("2d");
          x.drawImage(img, 0, 0, W, H);
          return [c, x];
        };
        const [cc, cx] = cnv(comp);
        const [, mx] = cnv(mask);
        const [, px] = cnv(photo);
        const cd = cx.getImageData(0, 0, W, H);
        const md = mx.getImageData(0, 0, W, H);
        const pd = px.getImageData(0, 0, W, H);

        // Compare WHITES to WHITES: the photo's brightest decile (its white/light
        // surfaces, which carry the scene's illuminant color and level) vs the
        // structure's brightest decile (the white frames). Matching overall means
        // is unsound — the dark teal glass dominated the structure mean and the
        // "correction" dyed the frames warm (measured B-R -13.6 on a neutral
        // photo). Whites-to-whites is the scene's actual white point.
        const brightStats = (data, pick) => {
          // pass 1: luminance histogram over picked pixels → P90 threshold
          const hist = new Array(256).fill(0);
          let n = 0;
          for (let i = 0; i < data.length; i += 4) {
            if (!pick(i)) continue;
            const l =
              (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114) | 0;
            hist[l]++;
            n++;
          }
          if (n < 500) return null;
          let acc = 0,
            thr = 255;
          for (let l = 255; l >= 0; l--) {
            acc += hist[l];
            if (acc >= n * 0.1) {
              thr = l;
              break;
            }
          }
          // pass 2: per-channel means over the bright set
          const sum = [0, 0, 0];
          let bn = 0;
          for (let i = 0; i < data.length; i += 4) {
            if (!pick(i)) continue;
            const l = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;
            if (l >= thr) {
              sum[0] += data[i];
              sum[1] += data[i + 1];
              sum[2] += data[i + 2];
              bn++;
            }
          }
          return bn ? sum.map((s) => s / bn) : null;
        };
        const skyRows = Math.floor(H * 0.35);
        const pStats = brightStats(pd.data, (i) => ((i / 4 / W) | 0) >= skyRows);
        const sStats = brightStats(cd.data, (i) => md.data[i] > 128);
        if (!pStats || !sStats) return compositeURL;
        const K = 0.5; // half-strength correction
        let gain = [0, 1, 2].map((ch) => {
          const g = 1 + K * (pStats[ch] / sStats[ch] - 1);
          return Math.min(1.2, Math.max(0.8, g));
        });
        // Split LUMINANCE from COLOR and cap the color part hard (±4%): the
        // brightness adaptation is the realism win, but on a warm sunny photo
        // the unbounded per-channel gains dyed the whole white structure CREAM
        // (user report 2026-08-15). White frames must stay white.
        const lumGain = (gain[0] + gain[1] + gain[2]) / 3;
        gain = gain.map((g) =>
          lumGain * Math.min(1.04, Math.max(0.96, g / lumGain)),
        );
        console.log(
          `[scene] tone-match: struct-white rgb(${sStats
            .map((v) => v.toFixed(0))
            .join(",")}) photo-white rgb(${pStats
            .map((v) => v.toFixed(0))
            .join(",")}) gains ${gain.map((g) => g.toFixed(3)).join("/")}`,
        );
        for (let i = 0; i < cd.data.length; i += 4) {
          const w = md.data[i] / 255;
          if (w > 0) {
            for (let ch = 0; ch < 3; ch++) {
              const v = cd.data[i + ch] * (1 - w + w * gain[ch]);
              cd.data[i + ch] = v < 0 ? 0 : v > 255 ? 255 : v;
            }
          }
        }
        cx.putImageData(cd, 0, 0);
        return cc.toDataURL("image/jpeg", 0.95);
      }

      // Black out everything ABOVE the traced roofline in a mask data URL. Keeps
      // the glass-only mask consistent with the under-existing composite/structure
      // clip, so the regional composite never pulls AI glass above the existing roof.
      async function clipAboveRoofline(maskURL, roofline, photoW, photoH) {
        const pts = roofline.map(([x, y]) => [x * photoW, y * photoH]);
        const img = await new Promise((res, rej) => {
          const im = new Image();
          im.onload = () => res(im);
          im.onerror = rej;
          im.src = maskURL;
        });
        const c = document.createElement("canvas");
        c.width = photoW;
        c.height = photoH;
        const x = c.getContext("2d");
        x.drawImage(img, 0, 0, photoW, photoH);
        x.beginPath();
        x.moveTo(0, 0);
        x.lineTo(photoW, 0);
        x.lineTo(photoW, pts[pts.length - 1][1]);
        for (let i = pts.length - 1; i >= 0; i--) x.lineTo(pts[i][0], pts[i][1]);
        x.lineTo(0, pts[0][1]);
        x.closePath();
        x.clip();
        x.fillStyle = "#000";
        x.fillRect(0, 0, photoW, photoH);
        return c.toDataURL("image/png");
      }

      async function renderScene(payload) {
        const {
          photoDataUrl,
          camera,
          walls,
          roof,
          frameColour,
          photoW,
          photoH,
        } = payload;

        const canvas = document.getElementById("c");
        canvas.width = photoW;
        canvas.height = photoH;

        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: true,
        });
        renderer.setSize(photoW, photoH);
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        // 1.05 → 1.12 (Phase 0): recover the brightness the removed blue env/fill
        // contributed. Only the STRUCTURE is affected — the photo background
        // bypasses tone mapping in r128 — so this lifts white frames back to
        // white without touching the house photo.
        renderer.toneMappingExposure = 1.12;

        const scene = new THREE.Scene();
        // Sky reflection for glass — set BEFORE geometry is built so glassMat
        // picks it up. Direct equirect envMap (reliable); PMREM IBL is a bonus
        // only if the software renderer supports it.
        SKY_ENV = makeSkyTexture();
        GLASS_STYLE = payload.repaintMode || null; // before geometry — glassMat reads it
        SHINGLE_TEX = makeShingleTexture(); // roof shingle courses for Canny
        try {
          const pmrem = new THREE.PMREMGenerator(renderer);
          scene.environment = pmrem.fromEquirectangular(SKY_ENV).texture;
          pmrem.dispose();
        } catch (e) {
          console.warn(
            "[scene] PMREM env failed (glass still reflects via envMap):",
            e.message,
          );
          scene.environment = SKY_ENV;
        }
        await new Promise((res, rej) => {
          new THREE.TextureLoader().load(
            photoDataUrl,
            (tex) => {
              tex.encoding = THREE.sRGBEncoding;
              scene.background = tex;
              // HYBRID photoreal: reflect the REAL scene in the glass instead of
              // the flat procedural sky, which just washed panes uniformly pale
              // (render 1). A perspective photo isn't a 360 pano, so as an equirect
              // env it's approximate — but it gives glass believable real-scene
              // colours (house, sky, yard) to mirror, which reads far more like
              // glass than a gradient. CLONE it (equirect mapping) so the flat
              // background copy is untouched. Set before geometry so glassMat uses it.
              if (GLASS_STYLE === "photoreal") {
                const env = tex.clone();
                env.mapping = THREE.EquirectangularReflectionMapping;
                env.needsUpdate = true;
                SKY_ENV = env;
                scene.environment = env;
              }
              res();
            },
            undefined,
            rej,
          );
        });

        // At most TWO walls are drawn (the ones facing the camera); any others are
        // priced but not rendered. WHICH two is the camera "wall combo": AB draws
        // walls A+B, BC draws B+C. This is independent of how many walls were
        // designed (a 3-wall room prices A+B+C but still renders just the AB or BC
        // pair). bSpec = the left/side wall (X=0, carries the gable when it's B),
        // cSpec = the front wall (faces the camera).
        // Fallback for older payloads with no combo: infer it from the wall set
        // (A present + no C ⇒ AB; otherwise BC).
        // Single flat wall (1-wall "nook fill"): only wall B, drawn flat in the
        // z=0 plane facing the camera — no side wall, no depth, no roof.
        const singleWall = payload.singleWall === true;
        let combo = payload.wallCombo;
        if (!singleWall && combo !== "AB" && combo !== "BC") {
          const ids = new Set(walls.map((w) => w.wall_id));
          combo = ids.has("A") && !ids.has("C") ? "AB" : "BC";
        }
        const pick = (id, idx) =>
          walls.find((w) => w.wall_id === id) || walls[idx];
        let bSpec, cSpec;
        if (singleWall) {
          bSpec = pick("B", 0);
          cSpec = null;
        } else if (combo === "AB") {
          bSpec = pick("A", 0);
          cSpec = pick("B", 1);
        } else {
          bSpec = pick("B", 0);
          cSpec = pick("C", 1);
        }
        // Single wall: bSpec IS the front wall (its width faces the camera), with
        // a token depth so the interior occluder/shadow have thickness.
        const wallW_B = singleWall ? 0.5 : (bSpec?.width_in || 216) / 12;
        const wallW_C = singleWall
          ? (bSpec?.width_in || 120) / 12
          : (cSpec?.width_in || 120) / 12;
        // The gable end belongs to wall B. In the BC pair (and 3-wall) B is the
        // side wall (bSpec) so the gable faces sideways — ridge along X. In the AB
        // pair B is the FRONT wall (cSpec), so the gable faces the camera — the
        // roof ridge and gable end are mirrored to run front-to-back (along Z).
        const gableOnFront = !!cSpec && cSpec.wall_id === "B";
        // CONFIGURED side-wall height, read before the fitted override below.
        const configuredWallH = (bSpec?.height_in || 96) / 12;
        // Use the PnP-fitted height so the structure seats on the patio. Falls
        // back to the configured height if auto-fit wasn't provided.
        let wallH = camera.solvedHeight || configuredWallH;
        // Fit factor: how much the PnP auto-height grew/shrank the wall vs the
        // configured height. EVERY vertical dimension must be multiplied by this or
        // it drifts off-proportion in the fitted wall (=1 when there's no fit). Used
        // for the unit transom/kneewall (scaleSpec below), the gable rise, AND the
        // structure-wide SCREEN rails (kneewall/chairrail/handrail) — those live in
        // screenOpts, not the specs, so they're scaled via screenOpts.hScale in
        // buildWall instead of here (they were the ones left unscaled: a 36in
        // chairrail sat at 3.0ft absolute in a 7.85ft-fitted 7ft wall → 38% instead
        // of the configured 43%, i.e. "way shorter" than the 2D — user report).
        const hScale = configuredWallH > 0 ? wallH / configuredWallH : 1;
        // CRITICAL: buildWall reads wall.height_in internally, so override both
        // wall specs to the fitted height — otherwise the walls stay at the
        // configured height while the roof sits at the fitted height, and they
        // visibly disconnect.
        if (camera.solvedHeight) {
          const scaleSpec = (spec) => {
            if (!spec) return;
            spec.height_in = wallH * 12;
            if (spec.gable_flat_in) spec.gable_flat_in *= hScale;
            for (const u of spec.units || []) {
              if (u.transom_h_in) u.transom_h_in *= hScale;
              if (u.kneewall_h_in) u.kneewall_h_in *= hScale;
            }
          };
          scaleSpec(bSpec);
          scaleSpec(cSpec);
        }
        // Roof rise above the eave, from the configured mountHeight (ground →
        // peak / wing-top). Scaled by the same factor the PnP auto-fit applied to
        // the walls, so the roof stays proportional to the box actually drawn —
        // otherwise a fitted-taller structure gets a roof that's relatively flat.
        // 0 (no mountHeight, or one at/below the wall height) leaves every
        // consumer on its old hardcoded default.
        // mountHeight is an ABSOLUTE ground→peak measurement, so pin the peak
        // there above the FITTED eave (rise = mountH − wallH). The old code
        // scaled the configured rise by the auto-fit factor (wallH/configuredWallH)
        // — but since auto-height consistently seats the wall a touch SHORTER than
        // entered, that shrank the whole peak to mountH×hScale, i.e. ~0.5-1ft too
        // low (error grows with height, so the walls looked fine but the peak was
        // off). Pinning to mountH keeps the total height on-spec; the eave still
        // seats on the markers, so only the peak moves. Guarded so a wall fitted
        // taller than the configured peak can't make a negative rise.
        const mountH = (roof.mount_height_in || 0) / 12;
        // Gable rise above the eave = the CONFIGURED rise (mountH − configuredWallH)
        // SCALED by the same factor the fit applied to the wall. auto-height is
        // DEGENERATE — a wall projects to the same pixels at many world heights, so
        // the fitted wallH (e.g. 6.49ft for an 8ft config) is NOT a trustworthy
        // absolute. Pinning the peak to the absolute mount (mountH − wallH) therefore
        // INFLATES the gable when the fit shrinks the wall: a 6.49ft eave + a peak
        // nailed to 10ft drew a 3.51ft triangle (54% of the wall) instead of the
        // designed 2ft (25%) — the "gable way too tall" report. Scaling by hScale
        // keeps the gable in the SAME proportion to the wall the user drew in 2D, so
        // it projects correctly whichever degenerate height the solver picked —
        // whether the fit shrank OR grew the wall. (The "peak too low" worry that
        // once replaced this measured the absolute peak number against a mount the
        // fit had already abandoned for the walls; the projection was never low.)
        const riseScale = configuredWallH > 0 ? wallH / configuredWallH : 1;
        ROOF_RISE = Math.max(0, mountH - configuredWallH) * riseScale;
        console.log(
          `[scene] mount: mount_height_in=${roof.mount_height_in} mountH=${mountH.toFixed(2)}ft ` +
            `wallH(fitted)=${wallH.toFixed(2)}ft configWallH=${configuredWallH.toFixed(2)}ft → ` +
            `ROOF_RISE=${ROOF_RISE.toFixed(2)}ft peak=${(wallH + ROOF_RISE).toFixed(2)}ft`,
        );
        const fc = fcHex(frameColour);
        const roofStyle = roof.style;
        // Under-existing: no NEW roof — walls rise to the EXISTING house roof.
        // Overshoot the fitted height so the walls clear the traced roofline
        // everywhere; applyUnderExisting() then clips them exactly to that line.
        // A single flat wall NEVER uses this machinery: it already tops out at the
        // clicked opening, so the 2×wallH interior occluder + roofline clip + header
        // beam don't apply (the tall occluder was bleeding charcoal into the sky
        // above the opening — user report on a 1-wall under-existing screen room).
        const underExisting = roofStyle === "under_existing" && !singleWall;
        // Under-existing only: whether to add a NEW gable/wing accent above the
        // header (true, default) or keep the EXISTING gable and just run the walls
        // up to it ("walls only", false). No effect on other roof styles.
        const includeGableWings = payload.includeGableWings !== false;
        // No height overshoot: panels build to the fitted eave height (wallH).
        // buildWall adds a gable/wing fill above that which overshoots and is
        // clipped to the traced roofline in applyUnderExisting().
        // Fixed dark shingle tone. We used to sample the photo's top strip, but on
        // backyard/pool shots that strip is SKY — so the roof rendered light/white.
        // The AI repaints the roof to match the house roof via the prompt anyway;
        // a dark composite roof reads correctly as "shingled" in the Canny pass.
        const shHex = 0x47423c;
        console.log(
          "[scene] wallW_B:",
          wallW_B,
          "wallW_C:",
          wallW_C,
          "wallH:",
          wallH,
        );
        // Which real wall landed in which slot, and each one's gable/wing flat
        // base. flat=0 on the wing wall means the transom never reached the
        // renderer and the wing draws as a plain triangle instead of the right
        // trapezoid the 2D configurator shows.
        console.log(
          `[scene] combo=${combo} roof=${roofStyle} rise=${ROOF_RISE.toFixed(2)}ft` +
            ` | side slot=${bSpec?.wall_id} flat=${bSpec?.gable_flat_in || 0}in` +
            ` | front slot=${cSpec?.wall_id} flat=${cSpec?.gable_flat_in || 0}in` +
            ` | wing=${roofStyle === "studio" ? (gableOnFront ? bSpec?.wall_id : cSpec?.wall_id) : "n/a"}`,
        );

        // ── Camera (PnP) ──
        // pnp.js returns a true Euclidean camera (cheirality-valid, principal point
        // at image centre), so a standard PerspectiveCamera reproduces its
        // projection exactly via position + up + lookAt(target).
        const cam = new THREE.PerspectiveCamera(
          camera.fovY,
          photoW / photoH,
          camera.near,
          camera.far,
        );
        cam.position.set(
          camera.position.x,
          camera.position.y,
          camera.position.z,
        );
        cam.up.set(camera.up.x, camera.up.y, camera.up.z);
        cam.lookAt(camera.target.x, camera.target.y, camera.target.z);
        cam.updateProjectionMatrix();
        cam.updateMatrixWorld(true);

        // ── Lighting ──
        // 0.7 → 0.78 (Phase 0): killing the blue env/fill light also removed its
        // brightness — bright-structure mean dropped 222→207. Restore the level
        // through the warm ambient so white frames stay white, not gray.
        scene.add(new THREE.AmbientLight(0xfff8f0, 0.78));
        const sun = new THREE.DirectionalLight(0xfff4e0, 1.15);
        sun.position.set(18, 25, -8);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 120;
        sun.shadow.camera.left = sun.shadow.camera.bottom = -25;
        sun.shadow.camera.right = sun.shadow.camera.top = 25;
        sun.shadow.bias = -0.001;
        scene.add(sun);
        // Phase 0 (2026-08-15): fill was 0xc8d8ff and hemisphere sky 0x87ceeb —
        // both cool blue, measurable as B-R +4.05 on bright structure (white
        // frames/solids tinted blue, user report "faint blueish glow"). Neutral
        // warm-gray fill + near-neutral hemisphere keep the shading shape but
        // drop the cast (measured via scratchpad measure_cast.py, not eyeballed).
        const fill = new THREE.DirectionalLight(0xe6e4e0, 0.38);
        fill.position.set(-10, 6, -15);
        scene.add(fill);
        scene.add(new THREE.HemisphereLight(0xe0e2e4, 0xc8a870, 0.28));

        // ── Geometry ──
        // World coords match PnP: origin=pt3 (left house bottom), +X right, +Y up, +Z toward camera.
        // Sunroom occupies X∈[0,wallW_C], Y∈[0,wallH], Z∈[0,wallW_B].

        const sunroom = new THREE.Group();
        // Manual "drop to ground" nudge: shift the whole structure down in Y so
        // it seats on the concrete when the traced markers sit a bit high.
        sunroom.position.y = -(payload.dropFt || 0);

        // The gable end (isGable) goes on whichever slot holds wall B: the side
        // wall (bSpec) for BC/3-wall, or the front wall (cSpec) for AB.
        // Screen rooms: structure-wide kneewall / chairrail / handrail. Null for
        // every other product line, in which case buildWall draws none of them.
        const screenOpts = payload.screenOptions || null;
        // Screen rails (kneewall/chairrail/handrail) are absolute inches drawn
        // against the FITTED wall, so scale them by the fit factor like every other
        // vertical dim (buildWall reads this). Structure-wide → carried on the
        // shared screenOpts object rather than per-spec.
        if (screenOpts) screenOpts.hScale = hScale;

        // Studio shed: the WING belongs to the wall that runs house→front (a side
        // wall, A or C), never to the front wall B. In the AB frame that's the
        // x=0 slot; the BC frame is transposed and it's the z=wallW_B slot — the
        // same flip buildRoof's studio branch makes. gableOnFront ⇔ AB frame.
        const studioWing = roofStyle === "studio";

        // ── Continuous header: pin the gable/wing base to the straight wall's
        // transom line ──────────────────────────────────────────────────────────
        // The gable/wing wall runs PLAIN glass up to its flat base; the straight
        // wall's glass ends at its transom sill. For the top-of-glass frame to be
        // continuous around the corner, the flat base must sit at the SAME height as
        // that transom sill. So the flat = the straight wall's transom height (+ one
        // frame width, since the two rails otherwise sit fw apart). Computed HERE,
        // off the transom the renderer actually draws — the typed height OR its 18%
        // fallback — because the frontend can't see the fallback and was sending a
        // wrong/zero flat. (Assumes the gable/wing wall has no transom of its own,
        // which is the configurator's normal case.)
        {
          const carrier =
            roofStyle === "gable"
              ? gableOnFront
                ? cSpec
                : bSpec
              : roofStyle === "studio"
                ? gableOnFront
                  ? bSpec
                  : cSpec
                : null;
          const straight =
            roofStyle === "gable"
              ? gableOnFront
                ? bSpec
                : cSpec
              : roofStyle === "studio"
                ? gableOnFront
                  ? cSpec
                  : bSpec
                : null;
          if (carrier && straight) {
            const DOOR_H_FT = 7; // matches WallBuilder's DOOR_HEIGHT_FT
            // The GABLE WALL'S OWN panel types decide the shape — the SAME signal
            // the 2D preview uses (`wallHasTransom` → `transomAbsorbs`), so 2D and
            // 3D finally agree (user-confirmed rule). A unit is a transom unit by
            // its PANEL TYPE (…_t / …_tk); do NOT test `transom_h_in`, which the
            // global default populates even on non-transom units — reading it was
            // the whole "carrier always looks like it has a transom" flip-flop.
            const isTransomUnit = (u) => {
              const pt = u.panel_type || "";
              return pt.endsWith("_t") || pt.endsWith("_tk");
            };
            // Deepest DRAWN transom height (ft) on a wall: typed max on its transom
            // units, else the renderer's 18% fallback (what buildPanel draws), else 0.
            const wallTransomFt = (wall) => {
              const us = (wall.units || []).filter(isTransomUnit);
              if (!us.length) return 0;
              const typed = us
                .map((u) => u.transom_h_in || 0)
                .filter((t) => t > 0);
              if (typed.length) return Math.max(...typed) / 12;
              const fwFt = (wall.frame_width_in || 0) / 12;
              return (wallH - fwFt * 2) * 0.18;
            };
            // Rule (user-confirmed):
            //   A. Gable wall HAS its own transom → flat 0 = TRIANGLE. Its units
            //      draw their transom band normally (same height as the other walls).
            //   B. No gable transom, the STRAIGHT wall has one → PENTAGON, flat = that
            //      transom height so the gable's glass-top lands on the transom sill
            //      around the corner (no unit transom on the gable wall to double).
            //   C. No transom anywhere → PENTAGON from excess wall height above a 7ft
            //      door line (mirrors the 2D's `excessFt`).
            let flatFt, why;
            // SCREEN ROOMS (2_inch) use a simpler rule than glass (user 2026-08-12):
            // a pentagon flat appears ONLY when the REFERENCE wall has a transom,
            // and the flat = that transom's specified height (NO +fw, NO excess-
            // height fallback, NO ≤7ft special-case). Reference = `straight`: for a
            // GABLE that's the straight side wall ("the other walls"); for a WING
            // `straight` is always the B wall. Glass rooms fall through to the
            // unchanged A/B/C chain below.
            const isScreenSpec = (s) =>
              (((s && s.units) || []).some((u) =>
                (u.panel_type || "").startsWith("screen"),
              ));
            if (isScreenSpec(carrier) || isScreenSpec(straight)) {
              const refT = wallTransomFt(straight);
              flatFt = refT > 0 ? refT : 0;
              why =
                refT > 0
                  ? "screen: reference-wall transom → pentagon (flat = transom h)"
                  : "screen: no reference-wall transom → triangle";
            } else if (configuredWallH <= DOOR_H_FT) {
              // A 7ft-or-shorter wall is ALWAYS a plain triangle, transom or not:
              // there's no excess height above a 7ft door line to grow a flat into.
              // The 2D enforces this (its excessFt = max(0, wallH-7) = 0 → triangle).
              // MUST use the CONFIGURED height, not the PnP-fitted `wallH` — the fit
              // drifts a few inches above 7 and was spuriously firing the excess-
              // pentagon on a configured-7ft no-transom wall (user report). This is
              // the FIRST check, so it changes NOTHING for any >7ft config — no
              // regression to the triangle / borrow-pentagon / excess cases below.
              flatFt = 0;
              why = "wall ≤7ft → always triangle";
            } else if (carrier.units && carrier.units.some(isTransomUnit)) {
              // Gable/wing wall has its OWN transom → that transom IS its top-of-
              // glass header, so draw a plain TRIANGLE on it (flat 0). Reverted the
              // wallH−7−transom flat + the straight-wall solid band (user request).
              flatFt = 0;
              why = "gable wall has its own transom → triangle";
            } else {
              const otherT = wallTransomFt(straight);
              if (otherT > 0) {
                // Land the two header bands on ONE axis around the corner. They
                // are different members drawn by different code:
                //   straight wall — buildPanel's transom sill rail, centred at
                //     wallH - tH - 1.5*fw   (panel sits at +fw, rail at h-tH-fw/2)
                //   gable wall    — buildWall's unit<->gable top rail, centred at
                //     wallH - flat - structFw/2
                // Equating the centres gives the term below. It reduces to the
                // historically-working "+fw" whenever fw === structFw, which is
                // how it read before buildWall split the thin cosmetic frame from
                // the structural one and left this line on the structural width
                // (the "frames don't line up" regression, glass only — on a 2"
                // screen system the two widths are equal so it never showed).
                // Range over the real wall systems: 4" -> +1in, 6" -> +0in. Never
                // negative, so a pentagon can never collapse into a triangle here.
                const structFwFt = (straight.frame_width_in || 0) / 12;
                const fwFt = thinFw(structFwFt);
                flatFt = otherT + 1.5 * fwFt - structFwFt / 2;
                why =
                  "no gable transom → pentagon on straight-wall transom " +
                  `(flat = transom + ${((1.5 * fwFt - structFwFt / 2) * 12).toFixed(1)}in rail offset)`;
              } else {
                flatFt = Math.max(0, wallH - DOOR_H_FT);
                why = "no transom anywhere → pentagon from excess height";
              }
            }
            carrier.gable_flat_in = flatFt * 12;
            console.log(
              `[scene] header-align: carrier=${carrier.wall_id} → flat=${carrier.gable_flat_in.toFixed(1)}in (${why})`,
            );
          }
        }

        if (singleWall) {
          // Flat nook-fill wall: draw wall B in the z=0 plane facing the camera.
          // No rotation (local +z faces the camera), no side wall, no gable — the
          // opening's top edge IS the wall top. roofStyle forced to a plain style
          // so buildWall skips the gable/wing/under-existing fill above the units.
          const flat = buildWall(
            bSpec,
            fc,
            "gable",
            shHex,
            false,
            includeGableWings,
            false,
            screenOpts,
            false,
          );
          flat.position.set(0, 0, 0);
          sunroom.add(flat);
        } else {
          if (bSpec) {
            // Side wall: plain rotation, local +z stays on the camera side.
            const wallB = buildWall(
              bSpec,
              fc,
              roofStyle,
              shHex,
              !gableOnFront,
              includeGableWings,
              false,
              screenOpts,
              studioWing && gableOnFront,
            );
            wallB.rotation.y = -Math.PI / 2;
            wallB.position.set(0, 0, 0);
            sunroom.add(wallB);
          }

          if (cSpec) {
            // Front wall: rotation.y=PI + scale.x=-1 ⇒ z-flip, so it's `mirrored`.
            const wallC = buildWall(
              cSpec,
              fc,
              roofStyle,
              shHex,
              gableOnFront,
              includeGableWings,
              true,
              screenOpts,
              studioWing && !gableOnFront,
            );
            wallC.rotation.y = Math.PI;
            wallC.scale.x = -1;
            wallC.position.set(0, 0, wallW_B);
            sunroom.add(wallC);
          }
        }

        if (!underExisting && !singleWall) {
          const roofGroup = buildRoof(
            wallW_B,
            wallW_C,
            wallH,
            roofStyle,
            shHex,
            fc,
            gableOnFront,
          );
          // Tag the whole roof so the glass-mask pass keeps it in the AI region:
          // the AI's shingled roof blends to the house far better than the flat
          // composite roof, and the roof carries no config to protect.
          roofGroup.traverse((o) => (o.userData.isRoof = true));
          sunroom.add(roofGroup);
        }
        sunroom.add(buildShadow(wallW_B, wallW_C));

        // ── Opaque dark INTERIOR occluder ──────────────────────────────────────
        // Sits just inside the glass walls so the see-through glass reveals a
        // uniform dark room — NOT the real house behind the sunroom. Without it,
        // the house's eave/window/siding lines bleed through the glass and Canny
        // copies them as phantom transoms/mullions. Unlit dark = no internal edges,
        // so the AI paints clean glass (dark interior + the sky sheen reflected on
        // the glass surface), which is how real sunroom glass photographs.
        {
          const inset = 0.5; // ft inside each wall, so it never pokes through glass
          // Under-existing: extend the occluder up past the gable/wing fill so the
          // glass fill shows a dark interior (not the existing roof bleeding through).
          const ih = underExisting ? wallH * 2 : Math.max(0.1, wallH - 0.2);
          const interior = new THREE.Mesh(
            new THREE.BoxGeometry(
              Math.max(0.1, wallW_C - inset * 2),
              ih,
              Math.max(0.1, wallW_B - inset * 2),
            ),
            new THREE.MeshBasicMaterial({ color: 0x171c1f }),
          );
          // Single flat wall faces +Z (camera side), so its dark interior sits
          // just BEHIND it (−z); the L-shape's front wall is at z=wallW_B with the
          // interior in front of it (smaller z), so it centres on wallW_B/2.
          interior.position.set(
            wallW_C / 2,
            ih / 2 + 0.1,
            singleWall ? -0.3 : wallW_B / 2,
          );
          sunroom.add(interior);
        }

        // Debug spheres — at PnP world positions (positive Z). Only drawn when
        // payload.debug is set; they must NOT appear in production renders that
        // get fed to the AI repaint step (they'd be painted into the output).
        if (payload.debug) {
          const mkSphere = (x, y, z, col) => {
            const s = new THREE.Mesh(
              new THREE.SphereGeometry(0.4, 16, 16),
              new THREE.MeshBasicMaterial({ color: col }),
            );
            s.position.set(x, y, z);
            return s;
          };
          sunroom.add(mkSphere(0, wallH, 0, 0xff0000)); // pt0: left house wall top
          sunroom.add(mkSphere(wallW_C, wallH, wallW_B, 0x00ff00)); // pt1: right front top
          sunroom.add(mkSphere(wallW_C, 0, wallW_B, 0xffff00)); // pt2: right front bottom
          sunroom.add(mkSphere(0, 0, wallW_B, 0x0000ff)); // pt4: left front ground
        }

        scene.add(sunroom);

        // ── Pass 1: the photoreal-ish composite (sunroom over the photo) ──
        renderer.render(scene, cam);
        let compositeURL = canvas.toDataURL("image/jpeg", 0.95);

        // ── Debug overlay: draw the user's CLICKED markers as dots on the
        // composite. Decisive test for "is it floating?": if the structure's
        // base sits on these dots it's seated (any gap is a visual/shadow
        // issue); if the structure floats ABOVE the dots the geometry isn't
        // rendering at world y=0. Toggle with RENDER_DEBUG=1 on the renderer.
        if (payload.debug && camera.imagePts) {
          const dbg = document.createElement("canvas");
          dbg.width = photoW;
          dbg.height = photoH;
          const dctx = dbg.getContext("2d");
          await new Promise((res) => {
            const im = new Image();
            im.onload = () => {
              dctx.drawImage(im, 0, 0, photoW, photoH);
              const tags = ["0 topL", "1 topR", "2 botR", "3 botL", "4 front"];
              camera.imagePts.forEach(([u, v], i) => {
                const ground = i >= 2; // ground markers in red, tops in cyan
                dctx.fillStyle = ground ? "#ff2020" : "#00e5ff";
                dctx.strokeStyle = "#000";
                dctx.lineWidth = 2;
                dctx.beginPath();
                dctx.arc(u, v, 9, 0, 2 * Math.PI);
                dctx.fill();
                dctx.stroke();
                dctx.font = "bold 18px sans-serif";
                dctx.fillStyle = "#000";
                dctx.fillText(tags[i], u + 12, v + 6);
                dctx.fillStyle = "#fff";
                dctx.fillText(tags[i], u + 11, v + 5);
              });
              // GREEN dots: where THREE.js's OWN camera projects the geometry
              // corners (the 5 worldPts). This is the actual render's projection,
              // not PnP's. If green sits on the cyan/red dots, the camera is
              // consistent and the structure is geometrically seated (any gap is
              // visual). If green sits up on the structure instead, scene.html's
              // camera differs from the solved one — a reconstruction bug.
              if (camera.worldPts) {
                dctx.fillStyle = "#22ff22";
                dctx.strokeStyle = "#000";
                camera.worldPts.forEach((wp) => {
                  const [sx, sy] = worldToScreen(
                    cam,
                    wp[0],
                    wp[1],
                    wp[2],
                    photoW,
                    photoH,
                  );
                  dctx.beginPath();
                  dctx.arc(sx, sy, 5, 0, 2 * Math.PI);
                  dctx.fill();
                  dctx.stroke();
                });
              }
              res();
            };
            im.src = compositeURL;
          });
          compositeURL = dbg.toDataURL("image/jpeg", 0.95);
        }

        // ── Pass 2: an EXACT structure mask ──
        // Render the sunroom as flat white on a black background with no photo.
        // This is pixel-perfect and immune to the tone-mapping that makes a
        // diff-against-the-photo mask flag the whole frame. The ground shadow
        // (userData.noMask) is hidden so only the real structure is masked.
        const savedBg = scene.background;
        const hidden = [];
        sunroom.traverse((o) => {
          if (o.userData && o.userData.noMask && o.visible) {
            o.visible = false;
            hidden.push(o);
          }
        });
        scene.background = new THREE.Color(0x000000);
        // DoubleSide: the front wall is mirrored (scale.x=-1) so its winding is
        // flipped, and a FrontSide override culled every FLAT face on it — the
        // gable/wing triangles were missing from the mask (closed boxes still
        // filled in, which is why only those two showed the hole).
        scene.overrideMaterial = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          side: THREE.DoubleSide,
        });
        renderer.render(scene, cam);
        let maskURL = canvas.toDataURL("image/png");
        scene.overrideMaterial = null;
        scene.background = savedBg;
        hidden.forEach((o) => (o.visible = true));

        // ── Pass 3: a GLASS-ONLY mask (white glass on black) ──
        // Powers the regional photoreal composite (tasks.py): the final render
        // keeps the AI's photoreal GLASS only inside this mask, and the EXACT
        // composite (frames, solids, doors, roof) everywhere else — so the AI adds
        // glass realism but CANNOT hallucinate config. Every glass mesh is tagged
        // in glassMat (material.userData.isGlass); a frame drawn in FRONT of glass
        // renders black here, correctly excluding it from the glass region.
        const gWhite = new THREE.MeshBasicMaterial({
          color: 0xffffff,
          side: THREE.DoubleSide,
        });
        const gBlack = new THREE.MeshBasicMaterial({
          color: 0x000000,
          side: THREE.DoubleSide,
        });
        scene.background = new THREE.Color(0x000000);
        const gmHidden = [];
        const gmMat = [];
        sunroom.traverse((o) => {
          if (!o.isMesh) return;
          if (o.userData && o.userData.noMask) {
            if (o.visible) {
              o.visible = false;
              gmHidden.push(o);
            }
            return;
          }
          gmMat.push([o, o.material]);
          // Keep GLASS and ROOF from the AI; everything else (frames, solids,
          // doors, walls) stays exact from the composite.
          const keepFromAI =
            o.userData.isRoof ||
            (o.material && o.material.userData && o.material.userData.isGlass);
          o.material = keepFromAI ? gWhite : gBlack;
        });
        renderer.render(scene, cam);
        let glassMaskURL = canvas.toDataURL("image/png");
        gmMat.forEach(([o, m]) => (o.material = m));
        gmHidden.forEach((o) => (o.visible = true));

        // ── Pass 4: SHADOW-only alpha mask (white gradient on black) ──
        // Lets tasks.py extend the background re-lock to structure ∪ shadow so
        // the contact shadow survives (it lives OUTSIDE the structure mask on
        // purpose — see buildShadow). Empty/black for modes with no soft shadow.
        const shHiddenL = [];
        const shSwap = [];
        scene.background = new THREE.Color(0x000000);
        sunroom.traverse((o) => {
          if (!o.isMesh) return;
          if (o.userData.isShadow && o.userData.maskMat) {
            shSwap.push([o, o.material]);
            o.material = o.userData.maskMat;
          } else if (o.visible) {
            o.visible = false;
            shHiddenL.push(o);
          }
        });
        renderer.render(scene, cam);
        const shadowMaskURL = canvas.toDataURL("image/png");
        shSwap.forEach(([o, m]) => (o.material = m));
        shHiddenL.forEach((o) => (o.visible = true));
        scene.background = savedBg;

        // Tone-match the structure to the photo's light (kontext/photoreal — the
        // modes whose composite pixels the AI actually reproduces; legacy canny
        // reads edges only, skip it). BEFORE the under-existing clip, which may
        // re-cover part of the adjusted region with photo — harmless.
        if (GLASS_STYLE === "kontext" || GLASS_STYLE === "photoreal") {
          try {
            compositeURL = await toneMatchStructure(
              compositeURL,
              maskURL,
              photoDataUrl,
              photoW,
              photoH,
            );
          } catch (e) {
            console.warn("[scene] tone-match failed (composite unadjusted):", e.message);
          }
        }

        // Under-existing: clip both passes to the traced existing roofline and add
        // the header beam. No-op for every other roof style.
        if (underExisting && payload.roofline && payload.roofline.length >= 2) {
          const ue = await applyUnderExisting(
            compositeURL,
            maskURL,
            photoDataUrl,
            payload.roofline,
            photoW,
            photoH,
            fc,
          );
          compositeURL = ue.composite;
          maskURL = ue.mask;
          glassMaskURL = await clipAboveRoofline(
            glassMaskURL,
            payload.roofline,
            photoW,
            photoH,
          );
        }

        window.__result = {
          composite: compositeURL,
          mask: maskURL,
          glassMask: glassMaskURL,
          shadowMask: shadowMaskURL,
        };
        if (window.__done) window.__done(window.__result);
      }
    </script>
  </body>
</html>
