<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      body {
        background: #000;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
      (async function main() {
        try {
          const params = new URLSearchParams(location.search);
          const payload = JSON.parse(atob(params.get("config")));
          await renderScene(payload);
        } catch (err) {
          window.__error = err.message;
          console.error("[scene error]", err.message, err.stack);
        }
      })();

      function fcHex(name) {
        return (
          { white: 0xe2e2e2, tan: 0xb89a6a, bronze: 0x3e2810 }[name] ?? 0xe2e2e2
        );
      }
      function rgbHex(r, g, b) {
        return (r << 16) | (g << 8) | b;
      }
      function darken(hex, amt) {
        return rgbHex(
          Math.max(0, ((hex >> 16) & 0xff) - amt),
          Math.max(0, ((hex >> 8) & 0xff) - amt),
          Math.max(0, (hex & 0xff) - amt),
        );
      }
      function lighten(hex, amt) {
        return rgbHex(
          Math.min(255, ((hex >> 16) & 0xff) + amt),
          Math.min(255, ((hex >> 8) & 0xff) + amt),
          Math.min(255, (hex & 0xff) + amt),
        );
      }

      // No `= null` initializer: renderScene assigns this before its first await,
      // but a top-level `var ... = null` line runs AFTER that (once renderScene
      // suspends) and would clobber it back to null — which silently disabled the
      // glass sky-reflection until now, making dark glass read as a solid panel.
      var SKY_ENV; // equirect sky texture, set in renderScene

      function glassMat(hex, opacity = 0.8) {
        // Semi-transparent dark glass with a sky sheen — reads as real glass.
        // The catch in Canny mode: see-through glass also reveals the EXISTING
        // HOUSE behind the sunroom (its roof eave, window tops, siding), and Canny
        // traces those background lines AS IF they were sunroom mullions → phantom
        // transoms. The fix is NOT to make the glass opaque (that paints flat black
        // panels — no glass), but to put an OPAQUE DARK INTERIOR behind the glass
        // (see the interior occluder box + gable backing in renderScene/buildGable).
        // Then the glass shows a uniform dark room + sky reflection — exactly how
        // real sunroom glass photographs — with no background structure to copy.
        const m = new THREE.MeshPhysicalMaterial({
          color: hex,
          transparent: true,
          opacity,
          // LOW reflection on purpose. A strong sky reflection washes the glass
          // light, so the WHITE frames lose contrast against it and Canny drops
          // the thin mullions (→ wrong panel count / merged panels in the output).
          // Dark, low-reflection glass keeps the white frames high-contrast so
          // Canny traces every frame. The FINAL glass tone is set by the prompt,
          // not this composite color, so dark composite glass ≠ dark output.
          roughness: 0.3,
          metalness: 0.0,
          clearcoat: 0.15,
          clearcoatRoughness: 0.2,
          reflectivity: 0.2,
          envMapIntensity: 0.2,
          side: THREE.DoubleSide,
        });
        if (SKY_ENV) m.envMap = SKY_ENV; // subtle sky sheen only — kept low on purpose
        return m;
      }
      function solidMat(hex) {
        return new THREE.MeshStandardMaterial({
          color: hex,
          roughness: 0.65,
          metalness: 0.05,
        });
      }
      function frameMat(hex) {
        return new THREE.MeshStandardMaterial({
          color: hex,
          roughness: 0.25,
          metalness: 0.35,
        });
      }
      // Insect screen (2_inch screen rooms). Deliberately NOT glassMat: real screen
      // mesh is matte and reads as a flat dark plane — no sky sheen, no clearcoat,
      // no reflections. Giving it glass's envMap made FLUX paint window panes.
      //
      // UNLIT (MeshBasicMaterial), like the interior occluder. A lit material cannot
      // render dark here: between ambient 0.7, the hemisphere/fill lights and the
      // standard specular floor, even a pure-black albedo washes out to mid grey
      // (measured: albedo 0x2f353a → rgb(169,178,185); pure red → rgb(254,84,51),
      // i.e. an additive floor of ~84 on green alone). Screen mesh has to be flat
      // and dark or Canny finds no wall and FLUX paints glass.
      //
      // The hex looks far too dark because three r128 has no ColorManagement: this
      // value is consumed as LINEAR, then ACES tone-mapped and sRGB-encoded on the
      // way out (renderer.outputEncoding / toneMapping below). Calibrated against
      // the actual composite: 0x060709 → rgb(26,31,37), 0x0c0e11 → rgb(49,56,66).
      // Adjust by re-measuring, not by eyeballing the hex.
      //
      // DoubleSide because the front wall is mirrored (negative determinant flips
      // winding), same reason shingleMat needs it.
      function screenMat() {
        return new THREE.MeshBasicMaterial({
          color: 0x0c0e11,
          side: THREE.DoubleSide,
        });
      }
      // Solid kneewall skirt below the screens, per the configured material.
      function kneewallMat(solidStyle) {
        const hex =
          solidStyle === "vinyl"
            ? 0xe8e4dc
            : solidStyle === "hardieboard"
              ? 0xbfc4c2
              : 0xdcd0be; // "panel"
        return solidMat(hex);
      }
      // Procedural shingle texture: rows of asphalt-shingle courses with offset
      // tab joints. The COLOR doesn't matter to Canny (edges only) — the point is
      // the horizontal course LINES, which tell Canny "this is a shingled roof"
      // so the AI paints real dark shingles instead of a flat light roof.
      // No `= null` initializer on purpose: renderScene sets this before its first
      // await, but the top-level `var ... = null` line would run AFTER that (once
      // renderScene suspends) and clobber it back to null. A bare declaration keeps
      // whatever renderScene assigned.
      var SHINGLE_TEX;
      function makeShingleTexture() {
        const c = document.createElement("canvas");
        c.width = 128;
        c.height = 128;
        const x = c.getContext("2d");
        // Uniform dark base + clean horizontal course lines only. The earlier
        // alternating shades + tab joints made the AI paint "crimpled" shingles;
        // simple straight courses read as clean asphalt shingle rows.
        x.fillStyle = "#39342d";
        x.fillRect(0, 0, 128, 128);
        const rows = 7,
          rh = 128 / rows;
        x.strokeStyle = "rgba(0,0,0,0.45)";
        x.lineWidth = 2;
        for (let r = 1; r < rows; r++) {
          const y = r * rh;
          x.beginPath();
          x.moveTo(0, y);
          x.lineTo(128, y);
          x.stroke();
        }
        const t = new THREE.CanvasTexture(c);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(2, 2); // tune for course density if needed
        return t;
      }
      function shingleMat(hex) {
        const m = new THREE.MeshStandardMaterial({
          color: hex,
          roughness: 0.93,
          metalness: 0.0,
          side: THREE.DoubleSide, // camera is below the roofline — without this the
          // single-sided slopes get backface-culled and the roof renders invisible
        });
        if (SHINGLE_TEX) m.map = SHINGLE_TEX; // course lines for Canny
        return m;
      }

      function box(w, h, d, mat, x, y, z) {
        const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
        m.position.set(x, y, z);
        m.castShadow = m.receiveShadow = true;
        return m;
      }
      function frameBorder(w, h, d, fw, mat, skipTop) {
        const g = new THREE.Group();
        g.add(box(w, fw, d, mat, w / 2, fw / 2, 0)); // bottom rail
        // Top rail optional: panels skip it so it doesn't stack with the wall's
        // own top rail into a double-thick band under the gable.
        if (!skipTop) g.add(box(w, fw, d, mat, w / 2, h - fw / 2, 0));
        g.add(box(fw, h, d, mat, fw / 2, h / 2, 0)); // left mullion
        g.add(box(fw, h, d, mat, w - fw / 2, h / 2, 0)); // right mullion
        return g;
      }

      function buildPanel(unit, w, h, fw, fc) {
        const g = new THREE.Group(),
          fmat = frameMat(fc),
          D = 0.07;
        const pt = unit.panel_type;
        // Screen-room panel types (2_inch). The kneewall/chairrail/handrail are
        // structure-wide, not per unit, so they're drawn by buildWall — a screen
        // unit is just mesh, optionally with a transom above, optionally a door.
        const isScreen = pt.startsWith("screen");
        const hasTransom = [
          "fixed_transom",
          "fixed_tk",
          "oper_tk",
          "door_t",
          "screen_t",
          "screen_door_t",
        ].includes(pt);
        const hasKneewall = [
          "fixed_kneewall",
          "fixed_tk",
          "oper_kneewall",
          "oper_tk",
        ].includes(pt);
        const isDoor = ["door", "door_t", "screen_door", "screen_door_t"].includes(pt);
        const isOper = pt.startsWith("oper");
        const isSolid = pt === "solid_panel";
        let tH = unit.transom_h_in > 0 ? unit.transom_h_in / 12 : h * 0.18;
        let kH = unit.kneewall_h_in > 0 ? unit.kneewall_h_in / 12 : h * 0.22;
        if (hasTransom && hasKneewall && tH + kH > h * 0.7) {
          tH = kH = h * 0.25;
        }
        if (hasTransom) {
          const tmat = isScreen
            ? screenMat()
            : unit.transom_mat === "glass"
              ? glassMat(0x2b4754, 0.8)
              : solidMat(0xc8bcaa);
          g.add(box(w - fw * 2, tH, D, tmat, w / 2, h - tH / 2, 0));
          // bolder divider rail so Canny clearly separates the transom from the
          // main glass (otherwise the AI fills the transom as one solid panel)
          g.add(box(w, fw * 1.3, D * 1.3, fmat, w / 2, h - tH - fw / 2, 0));
        }
        const topY = hasTransom ? h - tH - fw : h;
        const botY = hasKneewall ? kH + fw : 0;
        const glH = Math.max(0.05, topY - botY);
        const glCY = botY + glH / 2;
        const mainMat = isScreen
          ? screenMat()
          : isSolid
            ? solidMat(0xdcd0be)
            : isDoor
              ? glassMat(0x2f4f5e, 0.74)
              : isOper
                ? glassMat(0x2b4754, 0.8)
                : glassMat(0x2b4754, 0.8);
        g.add(box(w - fw * 2, glH, D, mainMat, w / 2, glCY, 0));
        // Screen door: a hinged single leaf, not a slider. Give it its own bold
        // perimeter stile + a mid rail so Canny reads a DOOR inside the screen
        // wall — without it the door unit is indistinguishable from a screen bay.
        if (isScreen && isDoor) {
          // A hinged screen door: a full-height leaf inside the opening, with a
          // KICK RAIL low down (~14in above the leaf bottom) and nothing across the
          // middle. An earlier mid rail at panel centre read as a random horizontal
          // bar cutting the door in half — real screen doors have no centre rail.
          // Members are centred on the mesh plane (z=0) and deeper than it, so they
          // stand proud on BOTH faces — the mirrored front wall flips local +z.
          const x0 = fw,
            x1 = w - fw,
            dw = x1 - x0,
            topLeaf = botY + glH,
            sw = fw * 1.1, // stile / rail width
            kickY = botY + Math.min(1.17, glH * 0.2); // ~14in, clamped on short walls
          g.add(box(sw, glH, 0.16, fmat, x0 + sw / 2, glCY, 0)); // hinge stile
          g.add(box(sw, glH, 0.16, fmat, x1 - sw / 2, glCY, 0)); // latch stile
          g.add(box(dw, sw, 0.16, fmat, w / 2, topLeaf - sw / 2, 0)); // top rail
          g.add(box(dw, sw, 0.16, fmat, w / 2, botY + sw / 2, 0)); // bottom rail
          g.add(box(dw, sw * 1.1, 0.16, fmat, w / 2, kickY, 0)); // kick rail
          // Lever handle on the latch stile, at a believable ~36in.
          const handleY = botY + Math.min(3.0, glH * 0.5);
          g.add(
            box(fw * 1.8, fw * 0.45, fw * 0.9, solidMat(0x888888), x1 - fw * 2.0, handleY, 0.09),
          );
        }
        if (!isScreen && isDoor && ["sliding", "french"].includes(unit.door_style)) {
          // Bold center meeting stile so Canny reads TWO glass panels (a sliding
          // glass door), not a single narrow entry door.
          g.add(box(fw, glH, D * 1.6, fmat, w / 2, glCY, 0.012));
          // tall vertical pull handle on the active panel (sliding-door look)
          g.add(
            box(
              fw * 0.35,
              glH * 0.32,
              fw * 0.5,
              solidMat(0x888888),
              w / 2 + fw * 0.9,
              glCY,
              D * 0.95,
            ),
          );
        }
        if (isOper) g.add(box(fw * 0.4, glH, D * 1.6, fmat, w / 2, glCY, 0.01));
        if (hasKneewall) {
          const kmat =
            unit.kneewall_mat === "solid"
              ? solidMat(0xc8bcaa)
              : glassMat(0x2b4754, 0.8);
          g.add(box(w, fw, D * 1.2, fmat, w / 2, kH + fw / 2, 0));
          g.add(box(w - fw * 2, kH, D, kmat, w / 2, kH / 2, 0));
        }
        g.add(frameBorder(w, h, D * 1.4, fw, fmat, true)); // skip top rail (wall provides it)
        return g;
      }

      // `mirrored` = this wall is drawn with rotation.y=PI + scale.x=-1 (the FRONT
      // wall slot). That composite is a pure z-flip: local (x,y,z) → world
      // (x, y, wallW_B - z), so local +z points AWAY from the camera and local -z
      // points TOWARD it — the opposite of the un-mirrored side wall. Anything
      // whose correctness depends on which side of the glass it sits on (the dark
      // gable backing) must consult this. Frame members avoid it by being centred
      // on the glass plane and deeper than it, so they stand proud on both faces.
      function buildWall(wall, fc, roofStyle, shHex, isGable, includeGableWings = true, mirrored = false, screenOpts = null) {
        const g = new THREE.Group();
        const fw = wall.frame_width_in / 12,
          wallW = wall.width_in / 12,
          wallH = wall.height_in / 12;
        const fmat = frameMat(fc);
        const isScreenWall = (wall.units || []).some((u) =>
          (u.panel_type || "").startsWith("screen"),
        );
        let curX = fw;
        const dividers = []; // x of each frame BETWEEN units, for gable alignment
        for (const unit of wall.units) {
          const uw = unit.width_in / 12;
          const panel = buildPanel(unit, uw, wallH - fw * 2, fw, fc);
          panel.position.set(curX, fw, 0);
          g.add(panel);
          curX += uw;
          dividers.push(curX);
        }
        dividers.pop(); // last is the right edge, not an internal divider
        // Thick structural POSTS between units — real sunrooms have a chunky
        // vertical post where two units meet, distinct from the thin sash bar
        // inside an operable window (that one stays fw*0.4 in buildPanel). Drawn
        // proud (forward z) so Canny reads a bold post, not a hairline.
        const postW = fw * 3.0; // wider than the ~2*fw band the panel edges make
        for (const dx of dividers) {
          g.add(box(postW, wallH - fw * 2, 0.16, fmat, dx, wallH / 2, 0.03));
        }
        g.add(frameBorder(wallW, wallH, 0.12, fw, fmat));

        // ── Screen-room horizontals ────────────────────────────────────────────
        // Kneewall, chairrail and handrail span the WHOLE wall (they're configured
        // once for the structure, not per unit), so they're drawn here rather than
        // in buildPanel. All are centred on the mesh plane (z=0) and deeper than
        // it, so they stand proud on both faces of the mirrored front wall too.
        if (isScreenWall && screenOpts) {
          const kn = screenOpts.kneewall;
          if (kn && kn.enabled) {
            const kH = (parseFloat(kn.heightIn) || 0) / 12 || wallH * 0.22;
            // Opaque skirt drawn OVER the bottom of the screen mesh, plus a cap
            // rail. Cheaper and more robust than shortening every panel.
            g.add(box(wallW - fw * 2, kH, 0.11, kneewallMat(kn.solidStyle), wallW / 2, kH / 2, 0));
            g.add(box(wallW, fw * 1.3, 0.17, fmat, wallW / 2, kH + fw * 0.65, 0));
          }
          const cr = screenOpts.chairrail;
          if (cr && cr.enabled) {
            const cH = (parseFloat(cr.heightIn) || 0) / 12 || wallH * 0.45;
            g.add(box(wallW, fw * 1.2, 0.17, fmat, wallW / 2, cH, 0));
          }
          // Handrail trumps chairrail in the configurator (setScreenHandrail), so
          // both never render together. ~36" top rail over evenly spaced pickets.
          if (screenOpts.handrail && screenOpts.handrail.enabled) {
            const hH = 3.0;
            g.add(box(wallW, fw * 1.4, 0.18, fmat, wallW / 2, hH, 0));
            g.add(box(wallW, fw * 0.9, 0.15, fmat, wallW / 2, 0.35, 0));
            const gap = 0.45;
            for (let px = gap; px < wallW - gap * 0.5; px += gap) {
              g.add(box(fw * 0.5, hH - 0.35, 0.1, fmat, px, 0.35 + (hH - 0.35) / 2, 0));
            }
          }
        }

        if (isGable && roofStyle === "gable")
          g.add(buildGable(wallW, wallH, fw, shHex, wall.gable_glass, fc, dividers, mirrored, isScreenWall));

        // Under-existing: wall panels rise to the eave (wallH = the header). Above
        // that, the area up to the EXISTING roof is filled — drawn tall and clipped
        // to the traced roofline in post. Two flavors driven by includeGableWings:
        //   true  → a DISTINCT gable/wing accent (glass or solid per gable-glass
        //           config) sitting above a header beam — for roof-only/open
        //           existing structures where we ADD a new gable/wing.
        //   false → "walls only": the existing gable/end wall above is KEPT (it
        //           shows through from the photo above the roofline), so the new
        //           wall is just a plain glass continuation up to the existing
        //           header — no accent, no intermediate transom beam, so it reads
        //           as the wall meeting the header directly (e.g. screen-room
        //           conversions where the solid gable stays).
        if (roofStyle === "under_existing") {
          const Df = 0.07;
          const fillH = wallH; // overshoot above the header; clipped to the roofline
          // A screen room's infill is SCREEN, not glass — otherwise the area above
          // the header renders as a glass transom over screen walls and FLUX paints
          // window panes up there.
          const contMat = isScreenWall ? screenMat() : glassMat(0x2b4754, 0.8);
          if (includeGableWings) {
            const gg = wall.gable_glass;
            const isSolid = !!gg && gg.glassType === "solid";
            const fillMat = isSolid ? solidMat(0xdcd0be) : contMat;
            g.add(box(wallW - fw * 2, fillH, Df, fillMat, wallW / 2, wallH + fillH / 2, 0));
            // Header beam at the eave (separates the wall panels from the accent above).
            g.add(box(wallW, fw * 1.4, 0.16, fmat, wallW / 2, wallH, 0));
          } else {
            // Walls-only: seamless continuation, no accent, no header beam here.
            g.add(box(wallW - fw * 2, fillH, Df, contMat, wallW / 2, wallH + fillH / 2, 0));
          }
          // Posts continue up through the fill, aligned to the unit dividers.
          // CENTRED on the glass plane (z=0), not pushed to +z: the FRONT wall is
          // mirrored (rotation.y=PI + scale.x=-1 ⇒ local +z faces AWAY from the
          // camera), so a +z offset buried these posts behind the tinted glass —
          // they read as faint lines instead of frames continuing up from the
          // units. Centred + deep than the glass, they stand proud on BOTH faces,
          // so this is correct for the side wall and the front wall alike.
          for (const dx of dividers) {
            g.add(box(postW, fillH, 0.16, fmat, dx, wallH + fillH / 2, 0));
          }
        }
        return g;
      }

      function buildGable(wallW, wallH, fw, shHex, gableGlass, fc, dividers, mirrored = false, isScreen = false) {
        const g = new THREE.Group();
        const gH = wallH * 0.42,
          peakX = wallW / 2,
          peakY = wallH + gH;
        const D = 0.07;

        // Triangular gable face. Glass (with mullions splitting it into the
        // configured number of panes) when gable_glass is set, otherwise the
        // original shingle-matched solid triangle.
        // On a SCREEN room the non-solid gable is screen mesh, not glass — the
        // ScreenRoomBuilder even labels it "Gable Screen". Rendering it as tinted
        // glass made the gable read light/blue against black screen walls below.
        const glassType = gableGlass && gableGlass.glassType;
        const isGlass = !!gableGlass && glassType !== "solid";
        const paneCount = Math.max(1, parseInt(gableGlass && gableGlass.count) || 1);

        const shape = new THREE.Shape();
        shape.moveTo(0, wallH);
        shape.lineTo(wallW, wallH);
        shape.lineTo(peakX, peakY);
        shape.closePath();
        // Match the wall glass (dark tint) but a touch more opaque, so the brown
        // roof behind the gable doesn't show through and make it read as roof
        // instead of glass. The sky reflection (now enabled) keeps it from going
        // flat-black.
        const faceMat = isGlass
          ? isScreen
            ? screenMat()
            : glassMat(0x2b4754, 0.8)
          : gableGlass && glassType === "solid"
            ? solidMat(0xc8bcaa)
            : shingleMat(shHex);
        const face = new THREE.Mesh(new THREE.ShapeGeometry(shape), faceMat);
        face.position.z = 0.05;
        face.castShadow = true;
        g.add(face);

        // Dark backing behind a GLASS gable so it shows a dark interior instead of
        // the roof/sky behind it (the interior occluder box only reaches the wall
        // top; the gable sits above it). Same purpose: no background bleed-through.
        // MUST sit on the far side of the glass FROM THE CAMERA. Local -z is
        // "behind" only for the un-mirrored side wall; on the mirrored front wall
        // (AB combo, where B carries the gable) the z-flip puts local -z in FRONT,
        // so a fixed -0.2 planted this opaque plate 0.25ft toward the camera and it
        // depth-tested over the gable as a black triangle. Offset away from the
        // face along whichever local direction actually points away from the camera.
        // Screen mesh is already opaque and unlit, so it needs no backing plate —
        // nothing bleeds through it. Only real glass does.
        if (isGlass && !isScreen) {
          const gableBack = new THREE.Mesh(
            new THREE.ShapeGeometry(shape),
            // DoubleSide is REQUIRED, not cosmetic: the front wall is mirrored
            // (scale.x=-1), which flips the winding, so a default FrontSide plane
            // is backface-culled there and the backing vanishes entirely — the
            // roof slope and sky bleed through the gable glass. Same reason
            // shingleMat is DoubleSide.
            new THREE.MeshBasicMaterial({ color: 0x171c1f, side: THREE.DoubleSide }),
          );
          // And it must sit on the far side of the glass FROM THE CAMERA. Local -z
          // is "behind" only on the un-mirrored side wall; the mirrored front wall
          // (AB combo, where B carries the gable) z-flips, so -0.2 there put the
          // plate 0.25ft TOWARD the camera. Offset away from the face along
          // whichever local direction actually points away from the camera.
          gableBack.position.z = 0.05 + (mirrored ? 0.25 : -0.25);
          g.add(gableBack);
        }

        const fmat = frameMat(fc);

        // Glass gable mullions. ALIGN them to the wall's unit dividers so the
        // verticals run continuously from the units up into the gable. The old
        // code divided the full width evenly from 0, but the units start inset by
        // one frame-width, so the gable mullions sat ~fw off from the unit frames
        // below — the "gable and unit frames are a little off" stagger. Fall back
        // to even paneCount division if no dividers were passed.
        const slopeY = (x) =>
          x <= peakX
            ? wallH + (gH / peakX) * x
            : wallH + (gH / peakX) * (wallW - x);
        let mullionXs = [];
        if (isGlass && dividers && dividers.length) {
          mullionXs = dividers.filter((x) => x > 0.05 && x < wallW - 0.05);
        } else if (isGlass && paneCount > 1) {
          for (let i = 1; i < paneCount; i++) mullionXs.push((wallW / paneCount) * i);
        }
        for (const mx of mullionXs) {
          const topY = slopeY(mx);
          const h = Math.max(0.05, topY - wallH);
          // Match the between-unit POST width (fw*3.0 in buildWall) so each
          // vertical reads as one continuous post from the unit up into the gable.
          // Depth is CENTRED on the gable face plane (z=0.05) and thicker than it,
          // so the mullion stands proud on both faces. The front wall is mirrored
          // (local +z faces away from the camera), so a shallow +z offset would
          // sink these behind the tinted glass — see the same fix in buildWall.
          g.add(box(fw * 3.0, h, 0.16, fmat, mx, wallH + h / 2, 0.05));
        }
        // (No separate gable sill — the wall's own top frame rail already sits
        // here. A second bar stacked on it made a double-thick band; one rail
        // matches the thickness of the frames below.)

        // Rake fascia/frieze along the gable slopes — the thick WHITE band that
        // sits BELOW the shingles (matching the house's gable eave detail). The
        // roof stays dark via the matte prompt, so this white band reads as the
        // frieze, not as white on the roof.
        const eMat = isGlass ? fmat : solidMat(darken(shHex, 15));
        const lLen = Math.sqrt(peakX ** 2 + gH ** 2),
          lAng = Math.atan2(gH, peakX);
        const lEdge = box(lLen, fw * 1.1, D, eMat, peakX / 2, wallH + gH / 2, 0.06);
        lEdge.rotation.z = lAng;
        g.add(lEdge);
        const rEdge = box(
          lLen,
          fw * 1.1,
          D,
          eMat,
          peakX + peakX / 2,
          wallH + gH / 2,
          0.06,
        );
        rEdge.rotation.z = -lAng;
        g.add(rEdge);

        // Peak cap.
        g.add(
          box(
            fw * 3,
            fw * 0.4,
            0.08,
            solidMat(darken(shHex, 15)),
            peakX,
            peakY - fw * 0.2,
            0.07,
          ),
        );
        return g;
      }

      function buildRoof(wallW_B, wallW_C, wallH, roofStyle, shHex, fc, gableOnFront = false) {
        const g = new THREE.Group(),
          smat = shingleMat(shHex),
          fmat = frameMat(fc),
          OH = 1.0; // ~1 ft roof overhang on every side (eaves + gable rakes)
        // AB pair: gable end faces the camera, so the whole gable roof is mirrored
        // to run front-to-back — ridge along Z (at x=wallW_C/2), gable triangles at
        // the front (z=wallW_B, over wall B) and house side. Built as explicit quads
        // (double-sided) so winding never culls a slope.
        if (roofStyle === "gable" && gableOnFront) {
          const gH = wallH * 0.42,
            ridgeX = wallW_C / 2,
            peakY = wallH + gH,
            z0 = -OH,
            z1 = wallW_B + OH;
          const quad = (a, b, c, d, hex) => {
            const geo = new THREE.BufferGeometry();
            geo.setAttribute(
              "position",
              new THREE.BufferAttribute(
                new Float32Array([...a, ...b, ...c, ...a, ...c, ...d]),
                3,
              ),
            );
            geo.computeVertexNormals();
            const mat = shingleMat(hex);
            mat.side = THREE.DoubleSide;
            const m = new THREE.Mesh(geo, mat);
            m.castShadow = m.receiveShadow = true;
            return m;
          };
          const rA = [ridgeX, peakY, z0],
            rB = [ridgeX, peakY, z1];
          // left slope (falls to x=0 side) — shaded; right slope — lit
          g.add(quad(rA, rB, [-OH, wallH, z1], [-OH, wallH, z0], darken(shHex, 25)));
          g.add(
            quad(
              rA,
              rB,
              [wallW_C + OH, wallH, z1],
              [wallW_C + OH, wallH, z0],
              shHex,
            ),
          );
          // white fascia boards under the two eaves (run front-to-back along Z)
          g.add(box(0.4, 0.4, wallW_B + OH * 2, fmat, -OH, wallH - 0.2, wallW_B / 2));
          g.add(
            box(0.4, 0.4, wallW_B + OH * 2, fmat, wallW_C + OH, wallH - 0.2, wallW_B / 2),
          );
        } else if (roofStyle === "gable") {
          const gH = wallH * 0.42,
            ridgeZ = wallW_B / 2;
          const pLen = Math.sqrt(ridgeZ ** 2 + gH ** 2),
            pAng = Math.atan2(gH, ridgeZ);
          // Extend the EAVE only (length pLen + OH, center shifted toward the
          // eave by OH/2 along the slope) so the slopes don't poke past the ridge
          // and overlap — that overlap was the rough/doubled peak in the composite.
          const dy = (OH / 2) * (gH / pLen),
            dz = (OH / 2) * (ridgeZ / pLen);
          // house-side slope: rises from z=0 to ridge at z=ridgeZ
          const lm = new THREE.Mesh(
            new THREE.PlaneGeometry(wallW_C + OH * 2, pLen + OH),
            smat,
          );
          lm.rotation.x = Math.PI / 2 - pAng;
          lm.position.set(wallW_C / 2, wallH + gH / 2 - dy, ridgeZ / 2 - dz);
          lm.castShadow = lm.receiveShadow = true;
          g.add(lm);
          // front slope: falls from ridge at z=ridgeZ to z=wallW_B
          const rm = new THREE.Mesh(
            new THREE.PlaneGeometry(wallW_C + OH * 2, pLen + OH),
            shingleMat(darken(shHex, 25)),
          );
          rm.rotation.x = -(Math.PI / 2 - pAng);
          rm.position.set(wallW_C / 2, wallH + gH / 2 - dy, ridgeZ + ridgeZ / 2 + dz);
          rm.castShadow = rm.receiveShadow = true;
          g.add(rm);
          // No white ridge bar on top — real shingles have none, and it made the
          // AI paint a white stripe across the roof. Instead, white FASCIA boards
          // hang just BELOW the brown roof eaves (front + house side), giving the
          // overhang depth so the AI doesn't read the roof as flat.
          g.add(
            box(wallW_C + OH * 2, 0.4, 0.12, fmat, wallW_C / 2, wallH - 0.2, -OH),
          );
          g.add(
            box(
              wallW_C + OH * 2,
              0.4,
              0.12,
              fmat,
              wallW_C / 2,
              wallH - 0.2,
              wallW_B + OH,
            ),
          );
        } else {
          const slope = wallW_B * 0.08,
            pAng = Math.atan2(slope, wallW_B);
          const pLen = Math.sqrt(wallW_B ** 2 + slope ** 2) + OH;
          // studio slope: runs from z=0 (house) to z=wallW_B (front)
          const rm = new THREE.Mesh(
            new THREE.PlaneGeometry(wallW_C + OH * 2, pLen),
            smat,
          );
          rm.rotation.x = Math.PI / 2 - pAng;
          rm.position.set(wallW_C / 2, wallH + slope / 2, wallW_B / 2);
          rm.castShadow = rm.receiveShadow = true;
          g.add(rm);
          g.add(
            box(wallW_C + OH * 2, 0.15, 0.1, fmat, wallW_C / 2, wallH, -OH),
          );
        }
        return g;
      }

      function buildShadow(wallW_B, wallW_C) {
        // Stronger contact shadow on the patio — anchors the sunroom as a 3D
        // object standing IN FRONT of the house, not a window set into the wall.
        const m = new THREE.Mesh(
          new THREE.PlaneGeometry(wallW_C * 1.2, wallW_B * 0.8),
          new THREE.MeshBasicMaterial({
            color: 0x000000,
            transparent: true,
            opacity: 0.34,
          }),
        );
        m.rotation.x = -Math.PI / 2;
        m.position.set(wallW_C / 2, 0.01, wallW_B * 0.78);
        m.userData.noMask = true; // ground shadow is not part of the structure mask
        return m;
      }

      async function sampleShingle(photoDataUrl, photoW, photoH) {
        const tmp = document.createElement("canvas");
        tmp.width = photoW;
        tmp.height = photoH;
        const tc = tmp.getContext("2d");
        await new Promise((res, rej) => {
          const img = new Image();
          img.onload = () => {
            tc.drawImage(img, 0, 0, photoW, photoH);
            res();
          };
          img.onerror = rej;
          img.src = photoDataUrl;
        });
        const startY = Math.floor(photoH * 0.08),
          stripH = Math.floor(photoH * 0.12);
        const id = tc.getImageData(0, startY, photoW, stripH).data;
        let r = 0,
          g = 0,
          b = 0,
          cnt = 0;
        for (let i = 0; i < id.length; i += 4) {
          r += id[i];
          g += id[i + 1];
          b += id[i + 2];
          cnt++;
        }
        return rgbHex(
          Math.round((r / cnt) * 0.75),
          Math.round((g / cnt) * 0.75),
          Math.round((b / cnt) * 0.75),
        );
      }

      function worldToScreen(cam, x, y, z, W, H) {
        const v = new THREE.Vector3(x, y, z).project(cam);
        return [((v.x + 1) / 2) * W, ((1 - v.y) / 2) * H];
      }

      // Procedural sky/ground equirect texture so glass reflects something — this
      // is what makes glass read as GLASS (sky on top, ground tone at the horizon)
      // instead of a see-through film. Used directly as material.envMap, which
      // works in software WebGL (no PMREMGenerator, which fails on swiftshader).
      function makeSkyTexture() {
        const c = document.createElement("canvas");
        c.width = 64;
        c.height = 512;
        const ctx = c.getContext("2d");
        const g = ctx.createLinearGradient(0, 0, 0, 512);
        g.addColorStop(0.0, "#7fb4e6"); // zenith blue
        g.addColorStop(0.42, "#cfe4f5"); // pale sky near horizon
        g.addColorStop(0.5, "#fbfcfb"); // bright horizon haze
        g.addColorStop(0.52, "#b9b0a0"); // ground
        g.addColorStop(1.0, "#6f6757"); // darker ground
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 64, 512);
        const tex = new THREE.CanvasTexture(c);
        tex.mapping = THREE.EquirectangularReflectionMapping;
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // ── Under-existing post-pass ────────────────────────────────────────────
      // There is no NEW roof for under-existing rooms — the walls rise to the
      // EXISTING house roof. The renderer builds the walls tall (overshooting),
      // then this clips everything ABOVE the traced roofline back to the original
      // photo (so the existing roof shows through) and lays a header beam along
      // the line. Returns updated { composite, mask } data URLs.
      // roofline = normalized [[x,y], ...] left->right; ends = back-top corners.
      async function applyUnderExisting(
        compositeURL, maskURL, photoDataUrl, roofline, photoW, photoH, frameHex,
      ) {
        const pts = roofline.map(([x, y]) => [x * photoW, y * photoH]);

        // Region from the top of the image DOWN to the polyline (flat-extrapolated
        // beyond the endpoints) — everything here is above the roofline.
        const abovePath = (ctx) => {
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.lineTo(photoW, 0);
          ctx.lineTo(photoW, pts[pts.length - 1][1]);
          for (let i = pts.length - 1; i >= 0; i--) ctx.lineTo(pts[i][0], pts[i][1]);
          ctx.lineTo(0, pts[0][1]);
          ctx.closePath();
        };
        const strokeHeader = (ctx, color) => {
          ctx.beginPath();
          ctx.moveTo(pts[0][0], pts[0][1]);
          for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i][0], pts[i][1]);
          ctx.lineWidth = Math.max(6, Math.round(photoH * 0.014));
          ctx.lineCap = "round";
          ctx.lineJoin = "round";
          ctx.strokeStyle = color;
          ctx.stroke();
        };
        const loadImg = (src) =>
          new Promise((res, rej) => {
            const im = new Image();
            im.onload = () => res(im);
            im.onerror = rej;
            im.src = src;
          });

        const [compImg, photoImg, maskImg] = await Promise.all([
          loadImg(compositeURL),
          loadImg(photoDataUrl),
          loadImg(maskURL),
        ]);

        // Composite: cover anything above the roofline with the original photo
        // (the existing roof), then draw the header beam in the frame colour.
        const cc = document.createElement("canvas");
        cc.width = photoW;
        cc.height = photoH;
        const cx = cc.getContext("2d");
        cx.drawImage(compImg, 0, 0, photoW, photoH);
        cx.save();
        abovePath(cx);
        cx.clip();
        cx.drawImage(photoImg, 0, 0, photoW, photoH);
        cx.restore();
        strokeHeader(cx, "#" + (frameHex >>> 0).toString(16).padStart(6, "0"));
        const composite = cc.toDataURL("image/jpeg", 0.95);

        // Mask: black out above the roofline; header beam is white (it IS
        // structure the AI should repaint).
        const mc = document.createElement("canvas");
        mc.width = photoW;
        mc.height = photoH;
        const mx = mc.getContext("2d");
        mx.drawImage(maskImg, 0, 0, photoW, photoH);
        mx.save();
        abovePath(mx);
        mx.clip();
        mx.fillStyle = "#000";
        mx.fillRect(0, 0, photoW, photoH);
        mx.restore();
        strokeHeader(mx, "#ffffff");
        const mask = mc.toDataURL("image/png");

        return { composite, mask };
      }

      async function renderScene(payload) {
        const {
          photoDataUrl,
          camera,
          walls,
          roof,
          frameColour,
          photoW,
          photoH,
        } = payload;

        const canvas = document.getElementById("c");
        canvas.width = photoW;
        canvas.height = photoH;

        const renderer = new THREE.WebGLRenderer({
          canvas,
          antialias: true,
          alpha: true,
        });
        renderer.setSize(photoW, photoH);
        renderer.setPixelRatio(1);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.outputEncoding = THREE.sRGBEncoding;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.05;

        const scene = new THREE.Scene();
        // Sky reflection for glass — set BEFORE geometry is built so glassMat
        // picks it up. Direct equirect envMap (reliable); PMREM IBL is a bonus
        // only if the software renderer supports it.
        SKY_ENV = makeSkyTexture();
        SHINGLE_TEX = makeShingleTexture(); // roof shingle courses for Canny
        try {
          const pmrem = new THREE.PMREMGenerator(renderer);
          scene.environment = pmrem.fromEquirectangular(SKY_ENV).texture;
          pmrem.dispose();
        } catch (e) {
          console.warn("[scene] PMREM env failed (glass still reflects via envMap):", e.message);
          scene.environment = SKY_ENV;
        }
        await new Promise((res, rej) => {
          new THREE.TextureLoader().load(
            photoDataUrl,
            (tex) => {
              tex.encoding = THREE.sRGBEncoding;
              scene.background = tex;
              res();
            },
            undefined,
            rej,
          );
        });

        // At most TWO walls are drawn (the ones facing the camera); any others are
        // priced but not rendered. WHICH two is the camera "wall combo": AB draws
        // walls A+B, BC draws B+C. This is independent of how many walls were
        // designed (a 3-wall room prices A+B+C but still renders just the AB or BC
        // pair). bSpec = the left/side wall (X=0, carries the gable when it's B),
        // cSpec = the front wall (faces the camera).
        // Fallback for older payloads with no combo: infer it from the wall set
        // (A present + no C ⇒ AB; otherwise BC).
        let combo = payload.wallCombo;
        if (combo !== "AB" && combo !== "BC") {
          const ids = new Set(walls.map((w) => w.wall_id));
          combo = ids.has("A") && !ids.has("C") ? "AB" : "BC";
        }
        const pick = (id, idx) => walls.find((w) => w.wall_id === id) || walls[idx];
        let bSpec, cSpec;
        if (combo === "AB") {
          bSpec = pick("A", 0);
          cSpec = pick("B", 1);
        } else {
          bSpec = pick("B", 0);
          cSpec = pick("C", 1);
        }
        const wallW_B = (bSpec?.width_in || 216) / 12;
        const wallW_C = (cSpec?.width_in || 120) / 12;
        // The gable end belongs to wall B. In the BC pair (and 3-wall) B is the
        // side wall (bSpec) so the gable faces sideways — ridge along X. In the AB
        // pair B is the FRONT wall (cSpec), so the gable faces the camera — the
        // roof ridge and gable end are mirrored to run front-to-back (along Z).
        const gableOnFront = !!cSpec && cSpec.wall_id === "B";
        // Use the PnP-fitted height so the structure seats on the patio. Falls
        // back to the configured height if auto-fit wasn't provided.
        let wallH = camera.solvedHeight || (bSpec?.height_in || 96) / 12;
        // CRITICAL: buildWall reads wall.height_in internally, so override both
        // wall specs to the fitted height — otherwise the walls stay at the
        // configured height while the roof sits at the fitted height, and they
        // visibly disconnect.
        if (camera.solvedHeight) {
          if (bSpec) bSpec.height_in = wallH * 12;
          if (cSpec) cSpec.height_in = wallH * 12;
        }
        const fc = fcHex(frameColour);
        const roofStyle = roof.style;
        // Under-existing: no NEW roof — walls rise to the EXISTING house roof.
        // Overshoot the fitted height so the walls clear the traced roofline
        // everywhere; applyUnderExisting() then clips them exactly to that line.
        const underExisting = roofStyle === "under_existing";
        // Under-existing only: whether to add a NEW gable/wing accent above the
        // header (true, default) or keep the EXISTING gable and just run the walls
        // up to it ("walls only", false). No effect on other roof styles.
        const includeGableWings = payload.includeGableWings !== false;
        // No height overshoot: panels build to the fitted eave height (wallH).
        // buildWall adds a gable/wing fill above that which overshoots and is
        // clipped to the traced roofline in applyUnderExisting().
        // Fixed dark shingle tone. We used to sample the photo's top strip, but on
        // backyard/pool shots that strip is SKY — so the roof rendered light/white.
        // The AI repaints the roof to match the house roof via the prompt anyway;
        // a dark composite roof reads correctly as "shingled" in the Canny pass.
        const shHex = 0x47423c;
        console.log(
          "[scene] wallW_B:",
          wallW_B,
          "wallW_C:",
          wallW_C,
          "wallH:",
          wallH,
        );

        // ── Camera (PnP) ──
        // pnp.js returns a true Euclidean camera (cheirality-valid, principal point
        // at image centre), so a standard PerspectiveCamera reproduces its
        // projection exactly via position + up + lookAt(target).
        const cam = new THREE.PerspectiveCamera(
          camera.fovY,
          photoW / photoH,
          camera.near,
          camera.far,
        );
        cam.position.set(
          camera.position.x,
          camera.position.y,
          camera.position.z,
        );
        cam.up.set(camera.up.x, camera.up.y, camera.up.z);
        cam.lookAt(camera.target.x, camera.target.y, camera.target.z);
        cam.updateProjectionMatrix();
        cam.updateMatrixWorld(true);

        // ── Lighting ──
        scene.add(new THREE.AmbientLight(0xfff8f0, 0.7));
        const sun = new THREE.DirectionalLight(0xfff4e0, 1.15);
        sun.position.set(18, 25, -8);
        sun.castShadow = true;
        sun.shadow.mapSize.set(2048, 2048);
        sun.shadow.camera.near = 0.5;
        sun.shadow.camera.far = 120;
        sun.shadow.camera.left = sun.shadow.camera.bottom = -25;
        sun.shadow.camera.right = sun.shadow.camera.top = 25;
        sun.shadow.bias = -0.001;
        scene.add(sun);
        const fill = new THREE.DirectionalLight(0xc8d8ff, 0.38);
        fill.position.set(-10, 6, -15);
        scene.add(fill);
        scene.add(new THREE.HemisphereLight(0x87ceeb, 0xc8a870, 0.28));

        // ── Geometry ──
        // World coords match PnP: origin=pt3 (left house bottom), +X right, +Y up, +Z toward camera.
        // Sunroom occupies X∈[0,wallW_C], Y∈[0,wallH], Z∈[0,wallW_B].

        const sunroom = new THREE.Group();
        // Manual "drop to ground" nudge: shift the whole structure down in Y so
        // it seats on the concrete when the traced markers sit a bit high.
        sunroom.position.y = -(payload.dropFt || 0);

        // The gable end (isGable) goes on whichever slot holds wall B: the side
        // wall (bSpec) for BC/3-wall, or the front wall (cSpec) for AB.
        // Screen rooms: structure-wide kneewall / chairrail / handrail. Null for
        // every other product line, in which case buildWall draws none of them.
        const screenOpts = payload.screenOptions || null;

        if (bSpec) {
          // Side wall: plain rotation, local +z stays on the camera side.
          const wallB = buildWall(bSpec, fc, roofStyle, shHex, !gableOnFront, includeGableWings, false, screenOpts);
          wallB.rotation.y = -Math.PI / 2;
          wallB.position.set(0, 0, 0);
          sunroom.add(wallB);
        }

        if (cSpec) {
          // Front wall: rotation.y=PI + scale.x=-1 ⇒ z-flip, so it's `mirrored`.
          const wallC = buildWall(cSpec, fc, roofStyle, shHex, gableOnFront, includeGableWings, true, screenOpts);
          wallC.rotation.y = Math.PI;
          wallC.scale.x = -1;
          wallC.position.set(0, 0, wallW_B);
          sunroom.add(wallC);
        }

        if (!underExisting)
          sunroom.add(buildRoof(wallW_B, wallW_C, wallH, roofStyle, shHex, fc, gableOnFront));
        sunroom.add(buildShadow(wallW_B, wallW_C));

        // ── Opaque dark INTERIOR occluder ──────────────────────────────────────
        // Sits just inside the glass walls so the see-through glass reveals a
        // uniform dark room — NOT the real house behind the sunroom. Without it,
        // the house's eave/window/siding lines bleed through the glass and Canny
        // copies them as phantom transoms/mullions. Unlit dark = no internal edges,
        // so the AI paints clean glass (dark interior + the sky sheen reflected on
        // the glass surface), which is how real sunroom glass photographs.
        {
          const inset = 0.5; // ft inside each wall, so it never pokes through glass
          // Under-existing: extend the occluder up past the gable/wing fill so the
          // glass fill shows a dark interior (not the existing roof bleeding through).
          const ih = underExisting ? wallH * 2 : Math.max(0.1, wallH - 0.2);
          const interior = new THREE.Mesh(
            new THREE.BoxGeometry(
              Math.max(0.1, wallW_C - inset * 2),
              ih,
              Math.max(0.1, wallW_B - inset * 2),
            ),
            new THREE.MeshBasicMaterial({ color: 0x171c1f }),
          );
          interior.position.set(wallW_C / 2, ih / 2 + 0.1, wallW_B / 2);
          sunroom.add(interior);
        }

        // Debug spheres — at PnP world positions (positive Z). Only drawn when
        // payload.debug is set; they must NOT appear in production renders that
        // get fed to the AI repaint step (they'd be painted into the output).
        if (payload.debug) {
          const mkSphere = (x, y, z, col) => {
            const s = new THREE.Mesh(
              new THREE.SphereGeometry(0.4, 16, 16),
              new THREE.MeshBasicMaterial({ color: col }),
            );
            s.position.set(x, y, z);
            return s;
          };
          sunroom.add(mkSphere(0, wallH, 0, 0xff0000)); // pt0: left house wall top
          sunroom.add(mkSphere(wallW_C, wallH, wallW_B, 0x00ff00)); // pt1: right front top
          sunroom.add(mkSphere(wallW_C, 0, wallW_B, 0xffff00)); // pt2: right front bottom
          sunroom.add(mkSphere(0, 0, wallW_B, 0x0000ff)); // pt4: left front ground
        }

        scene.add(sunroom);

        // ── Pass 1: the photoreal-ish composite (sunroom over the photo) ──
        renderer.render(scene, cam);
        let compositeURL = canvas.toDataURL("image/jpeg", 0.95);

        // ── Debug overlay: draw the user's CLICKED markers as dots on the
        // composite. Decisive test for "is it floating?": if the structure's
        // base sits on these dots it's seated (any gap is a visual/shadow
        // issue); if the structure floats ABOVE the dots the geometry isn't
        // rendering at world y=0. Toggle with RENDER_DEBUG=1 on the renderer.
        if (payload.debug && camera.imagePts) {
          const dbg = document.createElement("canvas");
          dbg.width = photoW;
          dbg.height = photoH;
          const dctx = dbg.getContext("2d");
          await new Promise((res) => {
            const im = new Image();
            im.onload = () => {
              dctx.drawImage(im, 0, 0, photoW, photoH);
              const tags = ["0 topL", "1 topR", "2 botR", "3 botL", "4 front"];
              camera.imagePts.forEach(([u, v], i) => {
                const ground = i >= 2; // ground markers in red, tops in cyan
                dctx.fillStyle = ground ? "#ff2020" : "#00e5ff";
                dctx.strokeStyle = "#000";
                dctx.lineWidth = 2;
                dctx.beginPath();
                dctx.arc(u, v, 9, 0, 2 * Math.PI);
                dctx.fill();
                dctx.stroke();
                dctx.font = "bold 18px sans-serif";
                dctx.fillStyle = "#000";
                dctx.fillText(tags[i], u + 12, v + 6);
                dctx.fillStyle = "#fff";
                dctx.fillText(tags[i], u + 11, v + 5);
              });
              // GREEN dots: where THREE.js's OWN camera projects the geometry
              // corners (the 5 worldPts). This is the actual render's projection,
              // not PnP's. If green sits on the cyan/red dots, the camera is
              // consistent and the structure is geometrically seated (any gap is
              // visual). If green sits up on the structure instead, scene.html's
              // camera differs from the solved one — a reconstruction bug.
              if (camera.worldPts) {
                dctx.fillStyle = "#22ff22";
                dctx.strokeStyle = "#000";
                camera.worldPts.forEach((wp) => {
                  const [sx, sy] = worldToScreen(cam, wp[0], wp[1], wp[2], photoW, photoH);
                  dctx.beginPath();
                  dctx.arc(sx, sy, 5, 0, 2 * Math.PI);
                  dctx.fill();
                  dctx.stroke();
                });
              }
              res();
            };
            im.src = compositeURL;
          });
          compositeURL = dbg.toDataURL("image/jpeg", 0.95);
        }

        // ── Pass 2: an EXACT structure mask ──
        // Render the sunroom as flat white on a black background with no photo.
        // This is pixel-perfect and immune to the tone-mapping that makes a
        // diff-against-the-photo mask flag the whole frame. The ground shadow
        // (userData.noMask) is hidden so only the real structure is masked.
        const savedBg = scene.background;
        const hidden = [];
        sunroom.traverse((o) => {
          if (o.userData && o.userData.noMask && o.visible) {
            o.visible = false;
            hidden.push(o);
          }
        });
        scene.background = new THREE.Color(0x000000);
        scene.overrideMaterial = new THREE.MeshBasicMaterial({ color: 0xffffff });
        renderer.render(scene, cam);
        let maskURL = canvas.toDataURL("image/png");
        scene.overrideMaterial = null;
        scene.background = savedBg;
        hidden.forEach((o) => (o.visible = true));

        // Under-existing: clip both passes to the traced existing roofline and add
        // the header beam. No-op for every other roof style.
        if (underExisting && payload.roofline && payload.roofline.length >= 2) {
          const ue = await applyUnderExisting(
            compositeURL, maskURL, photoDataUrl, payload.roofline, photoW, photoH, fc,
          );
          compositeURL = ue.composite;
          maskURL = ue.mask;
        }

        window.__result = { composite: compositeURL, mask: maskURL };
        if (window.__done) window.__done(window.__result);
      }
    </script>
  </body>
</html>
